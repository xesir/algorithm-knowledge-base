        // ===== Build Sidebar =====
        function sortSubNames(names) {
            return names.sort(function(a, b) {
                var ha = a === '总述' ? 0 : 1, hb = b === '总述' ? 0 : 1;
                return ha - hb || a.localeCompare(b);
            });
        }

        // ===== 三级知识点：父 / 子栏目 =====
        // 层级信息来自 knowledge_graph.json 的 parent 字段（build.js 注入 KNOWLEDGE_DATA）
        function kpTitleCompare(a, b) {
            return String(a.title).localeCompare(String(b.title), 'zh-Hans-CN');
        }

        function kpChildrenOf(id) {
            return KNOWLEDGE_DATA.filter(function(k) { return k.parent === id; }).sort(kpTitleCompare);
        }

        // 把同一分组内的条目按父子关系拆成「根 + 子列表」；父不在本组时子项当根显示（搜索过滤时不会丢条目）
        function splitKpHierarchy(items) {
            var ids = {};
            items.forEach(function(k) { ids[k.id] = 1; });
            var roots = [], children = {};
            items.forEach(function(k) {
                if (k.parent && k.parent !== k.id && ids[k.parent]) {
                    if (!children[k.parent]) children[k.parent] = [];
                    children[k.parent].push(k);
                } else {
                    roots.push(k);
                }
            });
            roots.sort(kpTitleCompare);
            Object.keys(children).forEach(function(id) { children[id].sort(kpTitleCompare); });
            return { roots: roots, children: children };
        }

        function kpItemHtml(kp, extraCls) {
            var active = currentId === kp.id ? ' active' : '';
            return '<div class="kp-item' + (extraCls || '') + active + '" onclick="selectKP(\'' + kp.id + '\')" title="' + escAttr(kp.title) + '">' + escHtml(kp.title) + '</div>';
        }

        function catalogKpItemHtml(kp, isChild) {
            return '<li class="catalog-kp-item' + (isChild ? ' catalog-kp-child' : '') + '" onclick="selectKP(\'' + kp.id + '\')" title="' + escAttr(kp.title) + '">' +
                escHtml(kp.title) + '</li>';
        }

        function buildSidebar(filter) {
            filter = filter || '';
            var hasFilter = filter || selectedTags.size > 0;
            var q = filter ? filter.toLowerCase() : '';
            var tree = {};

            KNOWLEDGE_DATA.forEach(function(kp) {
                if (!matchesTagFilter(kp)) return;
                // 搜索命中范围：标题 / ID / 分类 / 子分类 / 小分类 / 标签 / 正文
                if (q && searchBlob(kp).indexOf(q) < 0) return;
                if (!tree[kp.category]) tree[kp.category] = {};
                if (!tree[kp.category][kp.subcategory]) tree[kp.category][kp.subcategory] = {};
                var ssub = kp.subSubcategory || '';
                if (!tree[kp.category][kp.subcategory][ssub]) tree[kp.category][kp.subcategory][ssub] = [];
                tree[kp.category][kp.subcategory][ssub].push(kp);
            });

            var html = '';
            var cats = Object.keys(tree).sort();

            if (cats.length === 0 && filter) {
                html = '<div class="no-results">未找到匹配的知识点</div>';
                sidebarNav.innerHTML = html;
                return;
            }

            cats.forEach(function(cat) {
                var subs = tree[cat];
                var totalCount = Object.values(subs).reduce(function(s, ssubs) {
                    return s + Object.values(ssubs).reduce(function(s2, arr) { return s2 + arr.length; }, 0);
                }, 0);
                var expanded = hasFilter ? ' expanded' : '';

                html += '<div class="category' + expanded + '">';
                html += '<div class="category-header" onclick="this.parentElement.classList.toggle(\'expanded\')">';
                html += '<span class="chevron">▼</span>';
                html += '<span class="category-name category-name-link" onclick="event.stopPropagation(); showCategoryOverview(\'' + escAttr(cat) + '\')">' + escHtml(cat) + '</span>';
                html += '<span class="category-count">' + totalCount + '</span>';
                html += '</div>';
                html += '<div class="category-body">';

                sortSubNames(Object.keys(subs)).forEach(function(sub) {
                    var subCount = Object.values(subs[sub]).reduce(function(s, arr) { return s + arr.length; }, 0);
                    html += '<div class="subcategory' + (hasFilter ? ' expanded' : '') + '">';
                    html += '<div class="subcategory-header" onclick="this.parentElement.classList.toggle(\'expanded\')">';
                    html += '<span class="chevron chevron-sub">\u25BC</span>';
                    html += '<span class="subcategory-name subcategory-link" onclick="event.stopPropagation(); showCategoryOverview(\'' + escAttr(cat) + '\')" title="点击查看分类详情">' + escHtml(sub) + '</span>';
                    html += '<span class="category-count">' + subCount + '</span>';
                    html += '</div>';
                    html += '<div class="subcategory-body">';
                    var ssubs = subs[sub];
                    var allItems = [];
                    Object.keys(ssubs).forEach(function(k) { allItems = allItems.concat(ssubs[k]); });
                    var hasParent = allItems.some(function(k) {
                        return k.parent && allItems.some(function(x) { return x.id === k.parent; });
                    });
                    if (hasParent) {
                        // 该子分类存在三级父子关系：整组按父子层级渲染（跨 subSubcategory 也生效）
                        var grouped = splitKpHierarchy(allItems);
                        grouped.roots.forEach(function(kp) {
                            html += kpItemHtml(kp, '');
                            (grouped.children[kp.id] || []).forEach(function(child) {
                                html += kpItemHtml(child, ' kp-item-child');
                            });
                        });
                    } else {
                        Object.keys(ssubs).sort().forEach(function(ssub) {
                            if (ssub) {
                                html += '<div class="subsubcategory">' + escHtml(ssub) + '</div>';
                            }
                            var grouped = splitKpHierarchy(ssubs[ssub]);
                            grouped.roots.forEach(function(kp) {
                                html += kpItemHtml(kp, ssub ? ' kp-item-sub' : '');
                                (grouped.children[kp.id] || []).forEach(function(child) {
                                    html += kpItemHtml(child, ' kp-item-child');
                                });
                            });
                        });
                    }
                    html += '</div></div>';
                });

                html += '</div></div>';
            });

            sidebarNav.innerHTML = html;
        }

        // ===== Save / Restore Sidebar Expand State =====
        function saveSidebarState() {
            var state = { categories: {}, subcategories: {} };
            document.querySelectorAll('#sidebar-nav .category').forEach(function(el) {
                var nameEl = el.querySelector('.category-name');
                if (nameEl) state.categories[nameEl.textContent] = el.classList.contains('expanded');
            });
            document.querySelectorAll('#sidebar-nav .subcategory').forEach(function(el) {
                var nameEl = el.querySelector('.subcategory-name');
                if (nameEl) state.subcategories[nameEl.textContent] = el.classList.contains('expanded');
            });
            return state;
        }
        function restoreSidebarState(state) {
            document.querySelectorAll('#sidebar-nav .category').forEach(function(el) {
                var nameEl = el.querySelector('.category-name');
                if (nameEl && state.categories.hasOwnProperty(nameEl.textContent)) {
                    el.classList.toggle('expanded', state.categories[nameEl.textContent]);
                }
            });
            document.querySelectorAll('#sidebar-nav .subcategory').forEach(function(el) {
                var nameEl = el.querySelector('.subcategory-name');
                if (nameEl && state.subcategories.hasOwnProperty(nameEl.textContent)) {
                    el.classList.toggle('expanded', state.subcategories[nameEl.textContent]);
                }
            });
        }

        // 展开当前选中项所在的大类/子分类，避免默认收起时看不到高亮条目
        function revealActiveInSidebar() {
            var el = sidebarNav.querySelector('.kp-item.active');
            if (!el) return;
            var node = el.parentElement;
            while (node && node !== sidebarNav) {
                if (node.classList.contains('category') || node.classList.contains('subcategory')) {
                    node.classList.add('expanded');
                }
                node = node.parentElement;
            }
        }

        // 切到总目录/分类概览时同步清掉侧栏高亮，避免「主区域换了、侧栏还停在旧条目」
        function clearSidebarActive() {
            currentId = null;
            var actives = sidebarNav.querySelectorAll('.kp-item.active');
            for (var i = 0; i < actives.length; i++) {
                actives[i].classList.remove('active');
            }
        }

        // ===== Markdown + LaTeX 渲染（提取-解析-恢复三步法）=====
        // marked.js 会转义反斜杠、拆分 $ 分隔符，所以先把公式抽成占位符，解析完再换回 KaTeX HTML。
        // 行内公式护栏：$ 后紧跟空白、或 $ 前是空白，都不认作公式（正文里孤立的 $ 因此不会被误配成公式）。
        var INLINE_MATH_RE = /\$(?!\s)([^\$\n]*?[^\s$])\$/g;
        function renderMarkdownWithMath(raw) {
            var mathStore = [];
            var text = String(raw || '');

            // Step 1: Extract block math $$...$$ → placeholder
            text = text.replace(/\$\$([\s\S]+?)\$\$/g, function(m, p1) {
                var idx = mathStore.length;
                mathStore.push({ type: 'block', tex: p1 });
                return '@@KATEX' + idx + '@@';
            });

            // Step 2: Extract inline math $...$ → placeholder
            text = text.replace(INLINE_MATH_RE, function(m, p1) {
                var idx = mathStore.length;
                mathStore.push({ type: 'inline', tex: p1 });
                return '@@KATEX' + idx + '@@';
            });

            // Step 3: Parse Markdown (placeholders are plain text, safe from marked.js)
            var html = marked.parse(text);

            // Step 4: Replace placeholders with KaTeX-rendered HTML
            for (var i = 0; i < mathStore.length; i++) {
                var placeholder = '@@KATEX' + i + '@@';
                var rendered;
                try {
                    rendered = katex.renderToString(mathStore[i].tex, {
                        displayMode: mathStore[i].type === 'block',
                        throwOnError: false,
                        errorColor: '#cc0000'
                    });
                } catch (e) {
                    rendered = '<code>' + escHtml(mathStore[i].tex) + '</code>';
                }
                html = html.split(placeholder).join(rendered);
            }
            return html;
        }

        // ===== Select Knowledge Point =====
        var currentKp = null;
        var currentVer = 0;

        function selectKP(id) {
            var kp = KNOWLEDGE_DATA.find(function(k) { return k.id === id; });
            if (!kp) return;
            currentKp = kp;
            currentVer = 0; // build.js 已把主版本（world-needs-sunday优先，否则时间优先）放在 versions[0]
            document.title = kp.title + ' · 算法知识点查询系统';
            currentId = id;

            renderKpArticle(kp, currentVer);

            // Update URL
            location.hash = id;

            // Update sidebar active (preserve expand/collapse state)
            var savedState = saveSidebarState();
            buildSidebar(searchInput.value);
            restoreSidebarState(savedState);
            revealActiveInSidebar();

            // Scroll to top
            contentEl.scrollTop = 0;

            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function switchVersion(i) {
            if (!currentKp || !currentKp.versions || i < 0 || i >= currentKp.versions.length) return;
            currentVer = i;
            renderKpArticle(currentKp, i);
        }

        function renderKpArticle(kp, verIdx) {
            var versions = kp.versions || [{
                author: 'world-needs-sunday', content: kp.content, codePath: kp.codePath,
                timeComplexity: kp.timeComplexity, spaceComplexity: kp.spaceComplexity, tags: kp.tags
            }];
            var ver = versions[verIdx];

            // 等待密码状态加载完成，避免正文在拦截前闪现
            if (!lockStatusReady && window.supabaseClient) {
                renderColumnLockChecking();
                loadColumnLocks();
                return;
            }

            // 游客访问控制：有密码的专栏先显示解锁入口
            var lockKey = columnKeyForVersion(kp, verIdx);
            if (isColumnViewLocked(lockKey)) {
                renderColumnLockGate('kp', kp.id, verIdx, lockKey, kp.title);
                return;
            }

            // Version tabs（world-needs-sunday + 所有已知作者；缺版本的置灰）
            var tabsHtml = '<div class="version-tabs">';
            (typeof AUTHORS !== 'undefined' ? AUTHORS : ['world-needs-sunday']).forEach(function(author) {
                var vi = versions.findIndex(function(v) { return v.author === author; });
                var cls = 'version-tab' + (vi === verIdx ? ' active' : '') + (vi < 0 ? ' disabled' : '');
                var on = (vi >= 0) ? ' onclick="switchVersion(' + vi + ')"' : '';
                tabsHtml += '<button class="' + cls + '"' + on + '>' + escHtml(author) + '</button>';
            });
            tabsHtml += '</div>';

            // Meta bar
            var metaHtml = '<div class="meta-bar">';
            metaHtml += '<span class="badge badge-time">⏱ ' + escHtml(ver.timeComplexity || '未知') + '</span>';
            metaHtml += '<span class="badge badge-space">💾 ' + escHtml(ver.spaceComplexity || '未知') + '</span>';
            if (ver.tags && Array.isArray(ver.tags)) {
                ver.tags.forEach(function(tag) {
                    metaHtml += '<span class="tag">' + escHtml(tag) + '</span>';
                });
            }
            metaHtml += '<button class="viz-btn" onclick="openStarMap(\'' + kp.id + '\')">🌌 星图</button>';
            metaHtml += '<button class="viz-btn" onclick="openAuthor(\'' + escAttr(ver.author) + '\')">👤 作者</button>';
            metaHtml += '</div>';

            // 三级栏目：上级栏目 / 子栏目
            var parentKp = kp.parent ? KNOWLEDGE_DATA.find(function(k) { return k.id === kp.parent; }) : null;
            var childKps = kpChildrenOf(kp.id);
            var parentHtml = parentKp
                ? '<div class="kp-parent-bar">上级栏目：<span class="kp-parent-link" onclick="selectKP(\'' + parentKp.id + '\')">' + escHtml(parentKp.title) + '</span></div>'
                : '';
            var childrenHtml = '';
            if (childKps.length) {
                childrenHtml = '<div class="kp-children-section">' +
                    '<div class="kp-children-title">📂 子栏目（' + childKps.length + '）</div>' +
                    '<div class="kp-children-grid">';
                childKps.forEach(function(child) {
                    childrenHtml += '<span class="kp-child-chip" onclick="selectKP(\'' + child.id + '\')" title="' + escAttr(child.title) + '">' + escHtml(child.title) + '</span>';
                });
                childrenHtml += '</div></div>';
            }

            // Render content: 三步法保护 LaTeX（实现见 renderMarkdownWithMath）
            var contentHtml = '';
            try {
                contentHtml = renderMarkdownWithMath(ver.content);
            } catch(e) {
                contentHtml = '<p>内容渲染出错: ' + escHtml(e.message) + '</p>';
            }

            // 大类总述页：正文下方追加该大类的子分类目录（与分类概览页同一份数据）
            if (kp.hub) {
                contentHtml += '<div class="hub-directory">' +
                    '<div class="hub-directory-title">📂 ' + escHtml(kp.category) + ' · 子分类目录</div>' +
                    buildCategoryDirectory(kp.category, true) +
                    '</div>';
            }

            // Code section placeholder
            var codeHtml = '';
            if (ver.codePath && typeof CODE_DATA !== 'undefined' && CODE_DATA[ver.codePath]) {
                codeHtml = '<div class="code-section">' +
                    '<div class="code-header">' +
                    '<span class="code-filename">📄 ' + escHtml(ver.codePath.split('\\').pop()) + '</span>' +
                    '<button class="copy-btn" onclick="copyCode(this)">📋 复制</button>' +
                    '</div>' +
                    '<pre><code class="language-cpp" id="code-block"></code></pre>' +
                    '</div>';
            }

            // Nav buttons
            var idx = KNOWLEDGE_DATA.findIndex(function(k) { return k.id === kp.id; });
            var navHtml = '<div class="nav-buttons">';
            if (idx > 0) {
                navHtml += '<button class="nav-btn nav-prev" onclick="selectKP(\'' + KNOWLEDGE_DATA[idx-1].id + '\')" title="' + escAttr(KNOWLEDGE_DATA[idx-1].title) + '">← ' + escHtml(KNOWLEDGE_DATA[idx-1].title) + '</button>';
            } else {
                navHtml += '<span></span>';
            }
            if (idx < KNOWLEDGE_DATA.length - 1) {
                navHtml += '<button class="nav-btn nav-next" onclick="selectKP(\'' + KNOWLEDGE_DATA[idx+1].id + '\')" title="' + escAttr(KNOWLEDGE_DATA[idx+1].title) + '">' + escHtml(KNOWLEDGE_DATA[idx+1].title) + ' →</button>';
            } else {
                navHtml += '<span></span>';
            }
            navHtml += '</div>';

            // Prerequisites section
            var prereqHtml = '<div class="kp-links-section prereq">' +
                '<div class="kp-links-title">📖 前置知识点</div>';
            if (kp.prerequisites && kp.prerequisites.length > 0) {
                prereqHtml += '<div class="kp-links-list">';
                kp.prerequisites.forEach(function(pid) {
                    var pk = KNOWLEDGE_DATA.find(function(k) { return k.id === pid; });
                    if (pk) {
                        prereqHtml += '<span class="kp-link-chip prereq-chip" onclick="selectKP(\'' + pid + '\')" title="' + escAttr(pk.title) + '">' + escHtml(pk.title) + '</span>';
                    }
                });
                prereqHtml += '</div>';
            } else {
                prereqHtml += '<span class="kp-no-prereq">本知识点为基础内容，无特定前置要求</span>';
            }
            prereqHtml += '</div>';

            // Related section
            var relatedHtml = '';
            if (kp.related && kp.related.length > 0) {
                relatedHtml = '<div class="kp-links-section related">' +
                    '<div class="kp-links-title">🔗 相关知识点</div>' +
                    '<div class="kp-links-list">';
                kp.related.forEach(function(rid) {
                    var rk = KNOWLEDGE_DATA.find(function(k) { return k.id === rid; });
                    if (rk) {
                        relatedHtml += '<span class="kp-link-chip related-chip" onclick="selectKP(\'' + rid + '\')" title="' + escAttr(rk.title) + '">' + escHtml(rk.title) + '</span>';
                    }
                });
                relatedHtml += '</div></div>';
            }

            // Assemble
            contentEl.innerHTML =
                '<article class="article">' +
                '<h1>' + escHtml(kp.title) + '</h1>' +
                tabsHtml +
                parentHtml +
                metaHtml +
                prereqHtml +
                '<div class="markdown-body">' + contentHtml + '</div>' +
                codeHtml +
                childrenHtml +
                relatedHtml +
                navHtml +
                '</article>';

            // Set code content safely (avoids template literal injection)
            var codeBlock = document.getElementById('code-block');
            if (codeBlock && ver.codePath && CODE_DATA[ver.codePath]) {
                codeBlock.textContent = CODE_DATA[ver.codePath];
                hljs.highlightElement(codeBlock);
            }

            // Highlight code blocks in content
            contentEl.querySelectorAll('.markdown-body pre code').forEach(function(block) {
                hljs.highlightElement(block);
            });

            // Render math (fallback for \(...\) and \[...\] delimiters only)
            try {
                renderMathInElement(contentEl, {
                    delimiters: [
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option', 'annotation', 'math'],
                    throwOnError: false,
                    errorColor: '#cc0000'
                });
            } catch(e) {
                console.warn('KaTeX render error:', e);
            }
        }

        // ===== Copy Code =====
        function copyCode(btn) {
            var codeBlock = document.getElementById('code-block');
            if (!codeBlock) return;
            var text = codeBlock.textContent;
            navigator.clipboard.writeText(text).then(function() {
                btn.textContent = '✅ 已复制';
                setTimeout(function() { btn.textContent = '📋 复制'; }, 2000);
            }).catch(function() {
                // Fallback
                var ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '✅ 已复制';
                setTimeout(function() { btn.textContent = '📋 复制'; }, 2000);
            });
        }

        // ===== Catalog Page =====
        function showCatalog() {
            clearSidebarActive();
            // Build category tree (3-level: category > subcategory > subSubcategory)
            var tree = {};
            KNOWLEDGE_DATA.forEach(function(kp) {
                if (!tree[kp.category]) tree[kp.category] = {};
                if (!tree[kp.category][kp.subcategory]) tree[kp.category][kp.subcategory] = {};
                var ssub = kp.subSubcategory || '';
                if (!tree[kp.category][kp.subcategory][ssub]) tree[kp.category][kp.subcategory][ssub] = [];
                tree[kp.category][kp.subcategory][ssub].push(kp);
            });

            var cats = Object.keys(tree).sort();
            var totalKp = KNOWLEDGE_DATA.length;
            var totalCats = cats.length;
            var totalSubs = 0;
            cats.forEach(function(c) { totalSubs += Object.keys(tree[c]).length; });

            var html = '<div class="catalog-page">';
            document.title = '算法知识点查询系统';
            html += '<h1>📑 知识点总目录</h1>';
            html += '<div class="catalog-desc">按分类浏览所有知识点，点击任意知识点即可跳转查看详情。</div>';

            // Stats
            html += '<div class="catalog-stats">';

        // ===== Category Overview Page =====
        // 分类目录块：分类概览页与大类总述页共用（excludeHubs 时不重复列出总述条目）
        function buildCategoryDirectory(catName, excludeHubs) {
            var subs = {};
            var hasChild = {};
            KNOWLEDGE_DATA.forEach(function(k) { if (k.parent) hasChild[k.parent] = 1; });

                subs[kp.subcategory][ssub].push(kp);
            });
            var html = '';
            sortSubNames(Object.keys(subs)).forEach(function(subName) {
                var subKey = catName + '|' + subName;
                var subMeta = (typeof SUBCATEGORY_META !== 'undefined' && SUBCATEGORY_META[subKey]) || {};

                    html += renderKpCardList(allItems);
                    html += '</div></div>';

                var flatKps = [];
                var ssubGroups = [];
                Object.keys(ssubs).sort().forEach(function(ssub) {
                    if (ssub) ssubGroups.push({ name: ssub, items: ssubs[ssub] });
                    else flatKps = flatKps.concat(ssubs[ssub]);

                if (flatKps.length) html += renderKpCardList(flatKps);
                ssubGroups.forEach(function(group) {

                    }
                    html += '<div class="subsubcategory-block-grid">';
                    html += renderKpCardList(group.items);
                    html += '</div></div>';
                });
                html += '</div></div>';
            });
            return html;

        // ===== 作者专栏 =====
        // 兜底资料；线上以 Supabase profiles.signature / profiles.honors 为准（author_profiles 视图）
        var AUTHOR_PROFILES = {
            'world-needs-sunday': { signature: '', honors: [] },
            'Fohen': { signature: '', honors: [] },
            'Xesir': { signature: '', honors: [] },
            'lker': { signature: '', honors: [] },
            'stripe-python': { signature: '', honors: [] }
        };
        var DB_AUTHOR_PROFILES = {};

        function authorProfile(name) {
            var canonical = resolveAuthorName(name);
            var fromDb = DB_AUTHOR_PROFILES[canonical] || DB_AUTHOR_PROFILES[name];
            if (fromDb) {
                return {
                    signature: fromDb.signature || '',
                    honors: Array.isArray(fromDb.honors) ? fromDb.honors : [],
                    role: fromDb.role || ''
                };
            }
            return AUTHOR_PROFILES[canonical] || AUTHOR_PROFILES[name] || { signature: '', honors: [], role: '' };
        }

        function authorInitial(name) {
            var s = String(name || '?').trim();
            return s ? s.charAt(0).toUpperCase() : '?';
        }

        function authorAvatarHtml(name, extraClass) {
            var canonical = resolveAuthorName(name);
            var url = AUTHOR_AVATARS[canonical] || AUTHOR_AVATARS[name] || '';
            var cls = 'author-avatar' + (extraClass ? ' ' + extraClass : '');
            if (url) {
                return '<div class="' + cls + '"><img src="' + escAttr(url) + '" alt="' + escAttr(canonical) + '" loading="lazy"></div>';
            }
            return '<div class="' + cls + ' author-avatar-fallback">' + escHtml(authorInitial(canonical)) + '</div>';
        }

        function authorRateText(rate) {
            return (rate * 100).toFixed(1) + '%';
        }

        // ===== 作者贡献加权 =====
        // 新建 1 篇 = 1.0；修补 1 次 = 0.4 × 难度 × 体量 × 优先级 × 自改系数，单专栏上限 0.8。
        var CONTRIB_WEIGHTS = {
            create: 1.0,
            edit: 0.4,
            editCapPerColumn: 0.8,
            selfEdit: 0.25,
            sizeFloor: 0.8,
            sizeFullDelta: 2000
        };
        var EDIT_CREDITS = [];
        var editCreditsReady = false;
        var editCreditsLoading = false;
        var editCreditsError = false;
        var editCreditWarned = {};
        var AUTHOR_AVATARS = {};
        var authorProfilesLoading = false;
        var authorProfilesWarned = false;

        // profiles.nickname → 静态作者显示名；匹配不上时保留原名并在控制台警告一次
        var AUTHOR_ALIASES = {
            'world-needs-sunday': 'world-needs-sunday',
            'worldneedssunday': 'world-needs-sunday',
            'wnss': 'world-needs-sunday',
            'fenfeng': 'Fohen',
            'fohen': 'Fohen',
            'xesir': 'Xesir',
            'lker': 'lker',
            'stripe-python': 'stripe-python',
            'stripepython': 'stripe-python',
            'renzhaoyang': 'renzhaoyang',
            'dbywsc': 'dbywsc'
        };

        function resolveAuthorName(name) {
            var raw = String(name == null ? '' : name).trim();
            if (!raw) return 'world-needs-sunday';
            var lower = raw.toLowerCase();
            var known = (typeof AUTHORS !== 'undefined' && AUTHORS) ? AUTHORS : [];
            for (var i = 0; i < known.length; i++) {
                if (String(known[i]).toLowerCase() === lower) return known[i];
            }
            if (AUTHOR_ALIASES[lower]) return AUTHOR_ALIASES[lower];
            if (!editCreditWarned[raw]) {
                editCreditWarned[raw] = true;
                console.warn('[AKB] 作者名未匹配到静态作者列表，按原名计入：' + raw);
            }
            return raw;
        }

        var PROBLEM_DIFFICULTY_FACTOR = {
            '入门': 0.90,
            '普及−': 1.00,
            '普及/提高−': 1.10,
            '普及+/提高−': 1.20,
            '提高': 1.30,
            '提高+/省选−': 1.40,
            '省选/NOI−': 1.50,
            'NOI/NOI+/CTSC': 1.60
        };

        function contributionLevelFactor(level) {
            var lv = String(level || 'A').toUpperCase();
            if (lv === 'B') return 1.15;
            if (lv === 'C') return 1.30;
            return 1.00;
        }

        function contributionDifficultyFactor(kind, difficulty, level, cfRating) {
            if (kind !== 'problem') return contributionLevelFactor(level);
            if (PROBLEM_DIFFICULTY_FACTOR[difficulty]) return PROBLEM_DIFFICULTY_FACTOR[difficulty];
            var rating = Number(cfRating);
            if (isFinite(rating) && rating > 0) {
                return Math.max(0.9, Math.min(1.6, 0.9 + (rating - 800) / 4000));
            }
            return 1.00;
        }

        function contributionPriorityFactor(priority) {
            if (priority === 'low') return 0.90;
            if (priority === 'high') return 1.10;
            return 1.00;
        }

        function contributionSizeFactor(oldLen, newLen) {
            var delta = Math.abs(Number(newLen) - Number(oldLen));
            if (!isFinite(delta) || delta < 0) delta = 0;
            var ratio = Math.min(1, delta / CONTRIB_WEIGHTS.sizeFullDelta);
            return CONTRIB_WEIGHTS.sizeFloor + (1 - CONTRIB_WEIGHTS.sizeFloor) * ratio;
        }

        // 修补数据未就绪时不要把“加载失败”误显示成 0
        function editCountText(a) {
            if (window.supabaseClient) {
                if (!editCreditsReady) return '…';
                if (editCreditsError) return '—';
            }
            return a.editCount;
        }

        function findStaticColumnVersion(columnKey) {
            var target = findDbColumnTarget(columnKey);
            if (!target || !target.item || target.verIdx < 0) return null;
            return {
                item: target.item,
                ver: (target.item.versions || [])[target.verIdx] || {},
                verIdx: target.verIdx,
                kind: target.kind || 'knowledge'
            };
        }

        // 统计每位作者的加权贡献：新建版本 + 审批通过的修补工单
        function getAuthorStats() {
            var stats = {};
            function ensure(name) {
                if (!stats[name]) {
                    stats[name] = {
                        name: name,
                        kp: [],
                        prob: [],
                        editRecords: [],
                        creationCount: 0,
                        editCount: 0,
                        creationScore: 0,
                        editScore: 0,
                        score: 0,
                        total: 0,
                        rate: 0
                    };
                }
                return stats[name];
            }
            (typeof AUTHORS !== 'undefined' ? AUTHORS : []).forEach(function(name) {
                ensure(resolveAuthorName(name));
            });
            (typeof KNOWLEDGE_DATA !== 'undefined' ? KNOWLEDGE_DATA : []).forEach(function(kp) {
                (kp.versions || []).forEach(function(v, i) {
                    var author = resolveAuthorName(v.author || 'world-needs-sunday');
                    var s = ensure(author);
                    var level = String(v.level || 'A').toUpperCase();
                    s.kp.push({
                        id: kp.id, title: kp.title, category: kp.category || '未分类',
                        subcategory: kp.subcategory || '', verIdx: i, level: level,
                        kind: 'knowledge'
                    });
                    s.creationCount++;
                    s.creationScore += CONTRIB_WEIGHTS.create * contributionLevelFactor(level);
                });
            });
            if (typeof PROBLEMS_DATA !== 'undefined') {
                PROBLEMS_DATA.forEach(function(prob) {
                    (prob.versions || []).forEach(function(v, i) {
                        var author = resolveAuthorName(v.author || 'world-needs-sunday');
                        var s = ensure(author);
                        var difficulty = prob.difficulty || '暂未评定';
                        s.prob.push({
                            id: prob.id, title: prob.title, category: prob.category || '未分类',
                            oj: prob.oj || '', problemId: prob.problemId || '', verIdx: i,
                            difficulty: difficulty, cfRating: prob.cfRating,
                            kind: 'problem'
                        });
                        s.creationCount++;
                        s.creationScore += CONTRIB_WEIGHTS.create *
                            contributionDifficultyFactor('problem', difficulty, '', prob.cfRating);
                    });
                });
            }

            // 前端再按 (编辑者, 专栏) 去重一次；视图已去重，这里是防御性处理
            var latestEdits = {};
            (EDIT_CREDITS || []).forEach(function(row) {
                if (!row || !row.column_key) return;
                if (String(row.column_key).indexOf('sub-') === 0) return;
                if (!row.editor_name || row.editor_name === 'unknown') return;
                var key = String(row.editor_name) + '|' + String(row.column_key);
                var prev = latestEdits[key];
                if (!prev || String(row.reviewed_at || '') > String(prev.reviewed_at || '')) {
                    latestEdits[key] = row;
                }
            });

            Object.keys(latestEdits).forEach(function(key) {
                var row = latestEdits[key];
                var editor = resolveAuthorName(row.editor_name);
                var s = ensure(editor);
                var target = findStaticColumnVersion(row.column_key);
                var kind = row.kind || (target ? target.kind : 'knowledge');
                var level = target ? String(target.ver.level || 'A').toUpperCase() : 'A';
                var difficulty = row.difficulty || (target && target.item ? target.item.difficulty : '') || '暂未评定';
                var cfRating = target && target.item ? target.item.cfRating : '';
                var selfFactor = row.is_self_edit === true ? CONTRIB_WEIGHTS.selfEdit : 1.0;
                var credit = CONTRIB_WEIGHTS.edit *
                    contributionDifficultyFactor(kind, difficulty, level, cfRating) *
                    contributionSizeFactor(row.old_len, row.new_len) *
                    contributionPriorityFactor(row.priority) *
                    selfFactor;
                credit = Math.min(credit, CONTRIB_WEIGHTS.editCapPerColumn);
                s.editCount++;
                s.editScore += credit;
                s.editRecords.push({
                    columnKey: row.column_key,
                    columnName: row.column_name || row.column_key,
                    category: row.category || '未分类',
                    kind: kind,
                    difficulty: difficulty,
                    isSelfEdit: row.is_self_edit === true,
                    reviewedAt: row.reviewed_at || '',
                    credit: credit
                });
            });

            var totalAll = 0;
            Object.keys(stats).forEach(function(name) {
                var s = stats[name];
                s.total = s.creationCount;
                s.score = s.creationScore + s.editScore;
                totalAll += s.score;
            });
            Object.keys(stats).forEach(function(name) {
                var s = stats[name];
                s.rate = totalAll ? s.score / totalAll : 0;
            });
            return { stats: stats, totalAll: totalAll };
        }

        // 按加权贡献从高到低；同分时按名字排序
        function sortedAuthors() {
            var pack = getAuthorStats();
            var arr = Object.keys(pack.stats).map(function(n) { return pack.stats[n]; });
            arr.sort(function(a, b) { return (b.score - a.score) || String(a.name).localeCompare(String(b.name)); });
            return { authors: arr, totalAll: pack.totalAll };
        }

        function uniqueCount(list) {
            var seen = {};
            var n = 0;
            list.forEach(function(x) { if (!seen[x.id]) { seen[x.id] = 1; n++; } });
            return n;
        }

        // 侧栏作者列表（搜索只过滤作者名与签名）
        function buildAuthorSidebar(filter) {
            var q = (filter || '').toLowerCase();
            var pack = sortedAuthors();

            var shown = 0;
            pack.authors.forEach(function(a) {
                var prof = authorProfile(a.name);
                if (q && String(a.name).toLowerCase().indexOf(q) < 0 &&
                    String(prof.signature || '').toLowerCase().indexOf(q) < 0) return;
                shown++;
                var active = (currentAuthor === a.name) ? ' active' : '';
                var adminBadge = prof.role === 'admin' ? '<span class="admin-badge">管理员</span>' : '';
                html += '<div class="kp-item' + active + '" onclick="selectAuthor(\'' + escAttr(a.name) + '\')" title="' +
                    escAttr(a.name + ' · 加权贡献 ' + a.score.toFixed(2) + ' · 贡献率 ' + authorRateText(a.rate)) + '">' +
                    escHtml(a.name) + adminBadge + '<span class="author-side-count">' + a.total + '</span></div>';
            });
            if (!shown) html = '<div class="no-results">未找到匹配的作者</div>';
            sidebarNav.innerHTML = html;
        }

        // 作者列表页
        function showAuthors() {
            currentAuthor = null;
            var pack = sortedAuthors();
            document.title = '作者专栏 · 算法知识点查询系统';
            var html = '<div class="authors-page">';
            html += '<h1>👤 作者专栏</h1>';
            html += '<div class="catalog-desc">按加权贡献排名浏览本站作者。贡献率 = 加权贡献 ÷ 全站加权贡献（当前全站 ' +
                pack.totalAll.toFixed(2) + '）；新建 1 篇 = 1.0，修补 1 处 = 0.4 × 难度 × 体量 × 维护系数，单专栏最多 0.8；sub-* 未同步投稿暂不计入修补；修补数据每 30 秒自动刷新。</div>';
            if (!editCreditsReady && window.supabaseClient) {
                html += '<div class="author-note">正在加载修补贡献数据…</div>';
            } else if (editCreditsError) {
                html += '<div class="author-note">修补贡献数据未加载（请确认已执行 phase14-contribution-view.sql），当前仅显示新建贡献。</div>';
            }
            html += '<div class="author-grid">';
            pack.authors.forEach(function(a) {
                var prof = authorProfile(a.name);
                var sig = prof.signature ? escHtml(prof.signature) : '暂无签名';
                var honors = (prof.honors && prof.honors.length) ? escHtml(prof.honors.join(' · ')) : '暂无战绩（待补充）';

        function renderAuthorContrib(list, kind, isKp) {
            if (!list.length) return '<div class="author-empty">该栏目下暂无' + kind + '</div>';
            var groups = {};
            list.forEach(function(item) {
                if (!groups[item.category]) groups[item.category] = [];
                groups[item.category].push(item);
            });
            var html = '<div class="author-contrib-group">';
            html += '<div class="author-contrib-title">' + kind + ' · 按大类<span>共 ' + list.length + ' 版</span></div>';
            html += '<ul class="author-contrib-list">';
            Object.keys(groups).sort().forEach(function(cat) {
                html += '<li class="author-contrib-cat">' + escHtml(cat) + '<span class="author-contrib-sub">' + groups[cat].length + ' 条</span></li>';
                groups[cat].forEach(function(item) {
                    var sub = isKp ? item.subcategory : [item.oj, item.problemId].filter(Boolean).join(' ');
                    var click = isKp
                        ? 'goKpVersion(\'' + item.id + '\',' + item.verIdx + ')'
                        : 'goProblemVersion(\'' + item.id + '\',' + item.verIdx + ')';
                    html += '<li class="author-contrib-item" onclick="' + click + '">' + escHtml(item.title) +
                        (sub ? '<span class="author-contrib-sub">' + escHtml(sub) + '</span>' : '') + '</li>';
                });
            });
            html += '</ul></div>';
            return html;
        }

        function renderAuthorEditRecords(records) {
            if (!records || !records.length) {
                return '<div class="author-empty">暂无审批通过的修补记录</div>';
            }
            var sorted = records.slice().sort(function(a, b) {
                return String(b.reviewedAt || '').localeCompare(String(a.reviewedAt || ''));
            });
            var html = '<div class="author-edit-list">';
            sorted.forEach(function(rec) {
                var target = findDbColumnTarget(rec.columnKey);
                var clickable = !!(target && target.verIdx >= 0);
                var kind = target && target.kind ? target.kind : rec.kind;
                var kindLabel = kind === 'problem' ? '题目' : '知识点';
                var date = String(rec.reviewedAt || '').slice(0, 10);
                var meta = [kindLabel, rec.category, date].filter(Boolean).join(' · ');
                var onclick = '';
                if (clickable) {
                    var fn = kind === 'problem' ? 'goProblemVersion' : 'goKpVersion';
                    onclick = ' onclick="' + fn + '(\'' + escAttr(target.item.id) + '\',' + target.verIdx + ')"';
                }
                var selfBadge = rec.isSelfEdit ? '<span class="author-edit-badge">自改</span>' : '';
                html += '<div class="author-edit-item' + (clickable ? ' clickable' : '') + '"' + onclick + '>' +
                    '<div class="author-edit-main">' +
                        '<div class="author-edit-title">' + escHtml(rec.columnName) + selfBadge + '</div>' +
                        '<div class="author-edit-meta">' + escHtml(meta) + '</div>' +
                    '</div>' +
                    '<div class="author-edit-score">+' + rec.credit.toFixed(2) + '</div>' +
                '</div>';
            });
            html += '</div>';
            return html;

        function goProblemVersion(id, verIdx) {

        // 从条目页跳到当前版本作者的专栏
        function openAuthor(name) {
            if (!name) return;
            if (typeof AUTHOR_PROFILES !== 'undefined' && !AUTHOR_PROFILES[name]) {
                AUTHOR_PROFILES[name] = { signature: '', honors: [] };
            }
            switchMode('author');
            selectAuthor(name);
        }

        // ===== Build Problem Sidebar =====
        function buildProblemSidebar(filter) {
            filter = filter || '';
            var hasFilter = filter || selectedTags.size > 0;
            if (typeof PROBLEMS_DATA === 'undefined' || PROBLEMS_DATA.length === 0) {
                sidebarNav.innerHTML = '<div class="no-results">暂无题目，请添加题目到 problems/ 目录</div>';
                return;
            }

            var tree = {};

            var q = filter ? filter.toLowerCase() : '';

            PROBLEMS_DATA.forEach(function(prob) {
                if (!matchesTagFilter(prob)) return;
                // 搜索命中范围：标题 / ID / 分类 / OJ / 题号 / 难度 / 标签 / 正文
                if (q && searchBlob(prob).indexOf(q) < 0) return;
                var cat = prob.category || '未分类';
                if (!tree[cat]) tree[cat] = [];
                tree[cat].push(prob);
            });

            var html = '';
            var cats = Object.keys(tree).sort();

            if (cats.length === 0 && filter) {
                html = '<div class="no-results">未找到匹配的题目</div>';
                sidebarNav.innerHTML = html;
                return;
            }

            cats.forEach(function(cat) {
                var probs = tree[cat];
                var expanded = hasFilter ? ' expanded' : '';

                html += '<div class="category' + expanded + '">';
                html += '<div class="category-header" onclick="this.parentElement.classList.toggle(\'expanded\')">';
                html += '<span class="chevron">▼</span>';
                html += '<span class="category-name">' + escHtml(cat) + '</span>';
                html += '<span class="category-count">' + probs.length + '</span>';
                html += '</div>';
                html += '<div class="category-body">';

                probs.forEach(function(prob) {
                    var active = currentId === prob.id ? ' active' : '';
                    var label = prob.title;
                    if (prob.difficulty) {
                        label = diffMeta(prob.difficulty).icon + ' ' + label;
                    }
                    html += '<div class="kp-item' + active + '" onclick="selectProblem(\'' + prob.id + '\')" title="' + escAttr(prob.title) + '">' + escHtml(label) + '</div>';
                });

                html += '</div></div>';
            });

            sidebarNav.innerHTML = html;
        }

        // ===== Select Problem =====
        var currentProb = null;
        var currentProbVer = 0;

        function selectProblem(id) {
            var prob = PROBLEMS_DATA.find(function(p) { return p.id === id; });
            if (!prob) return;
            currentProb = prob;
            currentProbVer = 0; // build.js 已把主版本（world-needs-sunday优先，否则时间优先）放在 versions[0]
            document.title = prob.title + ' · 算法知识点查询系统';

            currentId = id;

            renderProbArticle(prob, currentProbVer);
            finishProblemRender(id);
        }

        function switchProbVersion(i) {
            if (!currentProb || !currentProb.versions || i < 0 || i >= currentProb.versions.length) return;
            currentProbVer = i;
            renderProbArticle(currentProb, i);
        }

        function finishProblemRender(id) {
            // Update URL
            location.hash = id;

            // Update sidebar active
            buildProblemSidebar(searchInput.value);
            revealActiveInSidebar();

            // Scroll to top
            contentEl.scrollTop = 0;

            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function renderProbArticle(prob, verIdx) {
            var versions = prob.versions || [{
                author: 'world-needs-sunday', content: prob.content, codePath: prob.codePath,
                timeComplexity: prob.timeComplexity, spaceComplexity: prob.spaceComplexity,
                tags: prob.tags, source: prob.source
            }];
            var ver = versions[verIdx];

            // 等待密码状态加载完成，避免正文在拦截前闪现
            if (!lockStatusReady && window.supabaseClient) {
                renderColumnLockChecking();
                loadColumnLocks();
                return;
            }

            // 游客访问控制：有密码的题目专栏先显示解锁入口
            var lockKey = columnKeyForVersion(prob, verIdx);
            if (isColumnViewLocked(lockKey)) {
                renderColumnLockGate('prob', prob.id, verIdx, lockKey, prob.title);
                return;
            }

            // Version tabs（world-needs-sunday + 所有已知作者；缺版本的置灰）
            var tabsHtml = '<div class="version-tabs">';
            (typeof AUTHORS !== 'undefined' ? AUTHORS : ['world-needs-sunday']).forEach(function(author) {
                var vi = versions.findIndex(function(v) { return v.author === author; });
                var cls = 'version-tab' + (vi === verIdx ? ' active' : '') + (vi < 0 ? ' disabled' : '');
                var on = (vi >= 0) ? ' onclick="switchProbVersion(' + vi + ')"' : '';
                tabsHtml += '<button class="' + cls + '"' + on + '>' + escHtml(author) + '</button>';
            });
            tabsHtml += '</div>';

            // Meta bar
            var diffClass = diffMeta(prob.difficulty).cls;

            var metaHtml = '<div class="meta-bar">';
            metaHtml += '<span class="badge ' + diffClass + '"> difficulty: ' + escHtml(prob.difficulty) + '</span>';
            var cfVal = prob.cfRating === undefined || prob.cfRating === null || prob.cfRating === '' ? 'NaN' : String(prob.cfRating);
            var cfCls = /^\d+$/.test(cfVal) ? 'badge-cf' : 'badge-cf-na';
            metaHtml += '<span class="badge ' + cfCls + '"> 难度评分: ' + escHtml(cfVal) + '</span>';
            if (prob.oj) {
                metaHtml += '<span class="badge badge-oj">' + escHtml(prob.oj) + '</span>';
            }
            if (prob.problemId) {
                metaHtml += '<span class="badge badge-pid">' + escHtml(prob.problemId) + '</span>';
            }
            metaHtml += '<span class="badge badge-time">⏱ ' + escHtml(ver.timeComplexity || '未知') + '</span>';
            metaHtml += '<span class="badge badge-space">💾 ' + escHtml(ver.spaceComplexity || '未知') + '</span>';
            if (ver.tags && Array.isArray(ver.tags)) {
                ver.tags.forEach(function(tag) {
                    metaHtml += '<span class="tag">' + escHtml(tag) + '</span>';
                });
            }
            if (ver.source) {
                metaHtml += '<span class="badge badge-source">👤 ' + escHtml(ver.source) + '</span>';
            }
            metaHtml += '<button class="viz-btn" onclick="openStarMap(\'' + prob.id + '\')">🌌 星图</button>';
            metaHtml += '<button class="viz-btn" onclick="openAuthor(\'' + escAttr(ver.author) + '\')">👤 作者</button>';
            metaHtml += '</div>';

            // Render content: 三步法保护 LaTeX（实现见 renderMarkdownWithMath）
            var contentHtml = '';
            try {
                contentHtml = renderMarkdownWithMath(ver.content);
            } catch(e) {
                contentHtml = '<p>内容渲染出错: ' + escHtml(e.message) + '</p>';
            }

            // Code section
            var codeHtml = '';
            if (ver.codePath && typeof CODE_DATA !== 'undefined' && CODE_DATA[ver.codePath]) {
                codeHtml = '<div class="code-section">' +
                    '<div class="code-header">' +
                    '<span class="code-filename">📄 ' + escHtml(ver.codePath.split('\\').pop()) + '</span>' +
                    '<button class="copy-btn" onclick="copyCode(this)">📋 复制</button>' +
                    '</div>' +
                    '<pre><code class="language-cpp" id="code-block"></code></pre>' +
                    '</div>';
            }

            // 涉及知识点（题目 → 知识点）
            var kpLinksHtml = '<div class="kp-links-section prereq"><div class="kp-links-title">📚 涉及知识点</div>';
            var kpIds = prob.knowledgePoints || [];
            if (kpIds.length > 0) {
                kpLinksHtml += '<div class="kp-links-list">';
                kpIds.forEach(function(kid) {
                    var pk = KNOWLEDGE_DATA.find(function(x) { return x.id === kid; });
                    if (pk) kpLinksHtml += '<span class="kp-link-chip prereq-chip" onclick="goKp(\'' + pk.id + '\')" title="' + escAttr(pk.title) + '">' + escHtml(pk.title) + '</span>';
                });
                kpLinksHtml += '</div>';
            } else {
                kpLinksHtml += '<span class="kp-no-prereq">本题暂未登记知识点</span>';
            }
            kpLinksHtml += '</div>';

            // Nav buttons
            var idx = PROBLEMS_DATA.findIndex(function(p) { return p.id === prob.id; });
            var navHtml = '<div class="nav-buttons">';
            if (idx > 0) {
                navHtml += '<button class="nav-btn nav-prev" onclick="selectProblem(\'' + PROBLEMS_DATA[idx-1].id + '\')" title="' + escAttr(PROBLEMS_DATA[idx-1].title) + '">← ' + escHtml(PROBLEMS_DATA[idx-1].title) + '</button>';
            } else {
                navHtml += '<span></span>';
            }
            if (idx < PROBLEMS_DATA.length - 1) {
                navHtml += '<button class="nav-btn nav-next" onclick="selectProblem(\'' + PROBLEMS_DATA[idx+1].id + '\')" title="' + escAttr(PROBLEMS_DATA[idx+1].title) + '">' + escHtml(PROBLEMS_DATA[idx+1].title) + ' →</button>';
            } else {
                navHtml += '<span></span>';
            }
            navHtml += '</div>';

            // Assemble
            contentEl.innerHTML =
                '<article class="article">' +
                '<h1>' + escHtml(prob.title) + '</h1>' +
                tabsHtml +
                metaHtml +
                '<div class="markdown-body">' + contentHtml + '</div>' +
                kpLinksHtml +
                codeHtml +
                navHtml +
                '</article>';

            // Set code content safely
            var codeBlock = document.getElementById('code-block');
            if (codeBlock && ver.codePath && CODE_DATA[ver.codePath]) {
                codeBlock.textContent = CODE_DATA[ver.codePath];
                hljs.highlightElement(codeBlock);
            }

            // Highlight code blocks in content
            contentEl.querySelectorAll('.markdown-body pre code').forEach(function(block) {
                hljs.highlightElement(block);
            });

            // Render math fallback
            try {
                renderMathInElement(contentEl, {
                    delimiters: [
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option', 'annotation', 'math'],
                    throwOnError: false,
                    errorColor: '#cc0000'
                });
            } catch(e) {
                console.warn('KaTeX render error:', e);
            }
        }

                html += '</div>';
                html += '<div class="catalog-category-body">';
                html += '<div class="catalog-sub-grid">';
                html += '<div class="catalog-subcard" style="grid-column: 1 / -1;">';
                html += '<ul class="catalog-kp-list">';
                probs.forEach(function(prob) {
                    var diffIcon = diffMeta(prob.difficulty).icon;
                    var ojLabel = prob.oj ? ' [' + escHtml(prob.oj) + (prob.problemId ? ' ' + escHtml(prob.problemId) : '') + ']' : '';
                    var cfTxt = String(prob.cfRating === undefined || prob.cfRating === null || prob.cfRating === '' ? 'NaN' : prob.cfRating);
                    var cfTag = /^\d+$/.test(cfTxt) ? '<span style="color:#4f46e5;font-size:0.72rem;margin-left:6px;">评分 ' + escHtml(cfTxt) + '</span>' : '';
                    html += '<li class="catalog-kp-item" onclick="selectProblem(\'' + prob.id + '\')" title="' + escAttr(prob.title) + '">' +
                        diffIcon + ' ' + escHtml(prob.title) + '<span style="color:var(--text-secondary);font-size:0.75rem;">' + ojLabel + '</span>' + cfTag + '</li>';
                });
                html += '</ul></div>';
                html += '</div></div></div>';
            });

            html += '</div>';
            contentEl.innerHTML = html;
            contentEl.scrollTop = 0;

            document.getElementById('sidebar').classList.remove('open');
        }

        // ===== Toggle Dark =====
        function toggleDark() {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
        }

        // ===== Keyboard =====
        function handleKeyboard(e) {
            // '/' focuses search
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
                return;
            }
            // Escape clears search
            if (e.key === 'Escape' && document.activeElement === searchInput) {
                searchInput.value = '';
                if (currentMode === 'kp') buildSidebar();
                else buildProblemSidebar();
                searchInput.blur();
                return;
            }
            // Alt+Left/Right for prev/next
            if (e.altKey && currentId) {
                if (currentMode === 'kp') {
                    var idx = KNOWLEDGE_DATA.findIndex(function(k) { return k.id === currentId; });
                    if (e.key === 'ArrowLeft' && idx > 0) {
                        e.preventDefault();
                        selectKP(KNOWLEDGE_DATA[idx-1].id);
                    }
                    if (e.key === 'ArrowRight' && idx < KNOWLEDGE_DATA.length - 1) {
                        e.preventDefault();
                        selectKP(KNOWLEDGE_DATA[idx+1].id);
                    }
                } else if (currentMode === 'prob' && typeof PROBLEMS_DATA !== 'undefined') {
                    var idx = PROBLEMS_DATA.findIndex(function(p) { return p.id === currentId; });
                    if (e.key === 'ArrowLeft' && idx > 0) {
                        e.preventDefault();
                        selectProblem(PROBLEMS_DATA[idx-1].id);
                    }
                    if (e.key === 'ArrowRight' && idx < PROBLEMS_DATA.length - 1) {
                        e.preventDefault();
                        selectProblem(PROBLEMS_DATA[idx+1].id);
                    }
                }
            }
        }

        // ===== Helpers =====
        function renderKpCard(kp, isChild) {
            return '<div class="subcategory-kp-card' + (isChild ? ' kp-card-child' : '') + '" onclick="selectKP(\'' + kp.id + '\')" title="' + escAttr(kp.title) + '">' + escHtml(kp.title) + '</div>';
        }

        // 分类概览里的卡片：父卡片在前，子栏目缩进跟随
        function renderKpCardList(items) {
            var grouped = splitKpHierarchy(items);
            var out = '';
            grouped.roots.forEach(function(kp) {
                out += renderKpCard(kp, false);
                (grouped.children[kp.id] || []).forEach(function(child) {
                    out += renderKpCard(child, true);
                });
            });
            return out;
        }

        // 洛谷评级 → 图标 / 徽章样式（配色与洛谷一致）/ 统计分组
        var DIFF_LEVELS = ['入门', '普及−', '普及/提高−', '普及+/提高−', '提高', '提高+/省选−', '省选/NOI−', 'NOI/NOI+/CTSC', '暂未评定'];
        function diffMeta(d) {
            switch (d) {
                case '入门': return { icon: '🟥', cls: 'badge-difficulty-0', group: 'easy' };
                case '普及−': return { icon: '🟧', cls: 'badge-difficulty-1', group: 'easy' };
                case '普及/提高−': return { icon: '🟨', cls: 'badge-difficulty-2', group: 'medium' };
                case '普及+/提高−': return { icon: '🟩', cls: 'badge-difficulty-3', group: 'medium' };
                case '提高': return { icon: '🟦', cls: 'badge-difficulty-4', group: 'hard' };
                case '提高+/省选−': return { icon: '🔵', cls: 'badge-difficulty-5', group: 'hard' };
                case '省选/NOI−': return { icon: '🟪', cls: 'badge-difficulty-6', group: 'hard' };
                case 'NOI/NOI+/CTSC': return { icon: '⬛', cls: 'badge-difficulty-7', group: 'hard' };
                default: return { icon: '⬜', cls: 'badge-difficulty-na', group: 'unknown' };
            }
        }

        function escHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escAttr(text) {
            if (!text) return '';
            return text.replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ===== 可视化：星图 / 维恩图 =====
        var VIZ_PALETTE = ['#ef4444', '#f59e0b', '#22c55e', '#38bdf8', '#a855f7', '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#84cc16'];
        var VIZ_SHAPES = ['circle', 'square', 'diamond', 'triangle', 'hex', 'star'];
        var CAT_STYLE_CACHE = null;
        var VIZ_INFO = {};
        var vizTipTimer = null;

        function catStyle(cat) {
            if (!CAT_STYLE_CACHE) {
                CAT_STYLE_CACHE = {};
                var cats = [];
                KNOWLEDGE_DATA.forEach(function(k) {
                    if (cats.indexOf(k.category) < 0) cats.push(k.category);
                });
                cats.sort();
                cats.forEach(function(c, i) {
                    CAT_STYLE_CACHE[c] = {
                        color: VIZ_PALETTE[i % VIZ_PALETTE.length],
                        shape: VIZ_SHAPES[i % VIZ_SHAPES.length]
                    };
                });
            }
            return CAT_STYLE_CACHE[cat] || { color: '#94a3b8', shape: 'circle' };
        }

        function diffColor(d) {
            var map = {
                '入门': '#FE4C61', '普及−': '#F39C11', '普及/提高−': '#FFC116',
                '普及+/提高−': '#52C41A', '提高': '#13C2C2', '提高+/省选−': '#3498DB',
                '省选/NOI−': '#9D3DCF', 'NOI/NOI+/CTSC': '#6b7280'
            };
            return map[d] || '#9CA3AF';
        }

        function vizShape(shape, x, y, r, color, op) {
            var alpha = (op === undefined) ? 1 : op;
            var fill = ' fill="' + color + '" fill-opacity="' + alpha + '"';
            if (shape === 'square') {
                return '<rect x="' + (x - r) + '" y="' + (y - r) + '" width="' + (2 * r) + '" height="' + (2 * r) + '" rx="2"' + fill + '/>';
            }
            if (shape === 'diamond') {
                return '<polygon points="' + x + ',' + (y - r) + ' ' + (x + r) + ',' + y + ' ' + x + ',' + (y + r) + ' ' + (x - r) + ',' + y + '"' + fill + '/>';
            }
            if (shape === 'triangle') {
                return '<polygon points="' + x + ',' + (y - r) + ' ' + (x + r * 0.88) + ',' + (y + r * 0.72) + ' ' + (x - r * 0.88) + ',' + (y + r * 0.72) + '"' + fill + '/>';
            }
            if (shape === 'dart') {
                // 灰色三角飞镖：外轮廓像三角，底部留一个内凹缺口，用来区分题目节点
                return '<polygon points="' + x + ',' + (y - r) + ' ' + (x + r) + ',' + (y + r * 0.85) + ' ' + x + ',' + (y + r * 0.22) + ' ' + (x - r) + ',' + (y + r * 0.85) + '"' + fill + '/>';
            }
            if (shape === 'hex') {
                var pts = [];
                for (var i = 0; i < 6; i++) {
                    var a = (-90 + i * 60) * Math.PI / 180;
                    pts.push((x + Math.cos(a) * r).toFixed(1) + ',' + (y + Math.sin(a) * r).toFixed(1));
                }
                return '<polygon points="' + pts.join(' ') + '"' + fill + '/>';
            }
            if (shape === 'star') {
                var pts2 = [];
                for (var j = 0; j < 10; j++) {
                    var a2 = (-90 + j * 36) * Math.PI / 180;
                    var rr = (j % 2 === 0) ? r : r * 0.45;
                    pts2.push((x + Math.cos(a2) * rr).toFixed(1) + ',' + (y + Math.sin(a2) * rr).toFixed(1));
                }
                return '<polygon points="' + pts2.join(' ') + '"' + fill + '/>';
            }
            return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '"' + fill + '/>';
        }

        function vizMoveTip(ev) {
            var tip = document.getElementById('viz-tip');
            var x = ev.clientX + 16, y = ev.clientY + 16;
            var w = tip.offsetWidth, h = tip.offsetHeight;
            if (x + w > window.innerWidth - 12) x = ev.clientX - w - 16;
            if (y + h > window.innerHeight - 12) y = ev.clientY - h - 16;
            tip.style.left = x + 'px';
            tip.style.top = y + 'px';
        }

        function bindVizNodes(container) {
            var nodes = container.querySelectorAll('.viz-node');
            for (var i = 0; i < nodes.length; i++) {
                (function(el) {
                    el.addEventListener('mouseenter', function(ev) {
                        var info = VIZ_INFO[el.getAttribute('data-id')];
                        if (!info) return;
                        if (vizTipTimer) clearTimeout(vizTipTimer);
                        vizTipTimer = setTimeout(function() {
                            var tip = document.getElementById('viz-tip');
                            tip.innerHTML = info;
                            tip.style.display = 'block';
                            vizMoveTip(ev);
                        }, 350);
                    });
                    el.addEventListener('mousemove', function(ev) {
                        var tip = document.getElementById('viz-tip');
                        if (tip.style.display === 'block') vizMoveTip(ev);
                    });
                    el.addEventListener('mouseleave', function() {
                        if (vizTipTimer) { clearTimeout(vizTipTimer); vizTipTimer = null; }
                        document.getElementById('viz-tip').style.display = 'none';
                    });
                })(nodes[i]);
            }
        }

        function vizAuthors(item) {
            var names = [];
            (item.versions || []).forEach(function(v) {
                if (v.author && names.indexOf(v.author) < 0) names.push(v.author);
            });
            return names.length ? names.join(' / ') : 'world-needs-sunday';
        }

        function vizTagHtml(tags) {
            var out = '';
            (tags || []).slice(0, 8).forEach(function(t) {
                out += '<span class="t-tag">' + escHtml(t) + '</span>';
            });
            return out;
        }

        // ---------- 星图 ----------
        var starCenterId = null;
        var starCenterType = 'kp';
        var showStarProblems = false;

        function openStarMap(nodeId) {
            var kp = null, prob = null;
            KNOWLEDGE_DATA.forEach(function(k) { if (k.id === nodeId) kp = k; });
            if (!kp && typeof PROBLEMS_DATA !== 'undefined') {
                PROBLEMS_DATA.forEach(function(p) { if (p.id === nodeId) prob = p; });
            }
            if (!kp && !prob) return;
            starCenterId = nodeId;
            starCenterType = prob ? 'prob' : 'kp';
            document.getElementById('viz-tip').style.display = 'none';
            var showCb = document.getElementById('star-show-problems');
            if (showCb) showCb.checked = showStarProblems;

            var kpById = {}, probById = {};
            KNOWLEDGE_DATA.forEach(function(k) { kpById[k.id] = k; });
            if (typeof PROBLEMS_DATA !== 'undefined') {
                PROBLEMS_DATA.forEach(function(p) { probById[p.id] = p; });
            }
            function nodeOf(id) { return probById[id] || kpById[id]; }

            var pre = [], dep = [], rel = [], par = [], chd = [], seen = {};
            seen[nodeId] = 1;
            if (kp) {
                // 三级栏目：父栏目 / 子栏目（双箭头表示从属）
                if (kp.parent && kpById[kp.parent] && !seen[kp.parent]) { seen[kp.parent] = 1; par.push(kp.parent); }
                KNOWLEDGE_DATA.forEach(function(k) {
                    if (!seen[k.id] && k.parent === nodeId) { seen[k.id] = 1; chd.push(k.id); }
                });
                (kp.prerequisites || []).forEach(function(id) {
                    if (kpById[id] && !seen[id]) { seen[id] = 1; pre.push(id); }
                });
                KNOWLEDGE_DATA.forEach(function(k) {
                    if (!seen[k.id] && (k.prerequisites || []).indexOf(nodeId) >= 0) { seen[k.id] = 1; dep.push(k.id); }
                });
                (kp.related || []).forEach(function(id) {
                    if (kpById[id] && !seen[id]) { seen[id] = 1; rel.push(id); }
                });
                if (showStarProblems && typeof PROBLEMS_DATA !== 'undefined') {
                    PROBLEMS_DATA.forEach(function(p) {
                        if (!seen[p.id] && (p.knowledgePoints || []).indexOf(nodeId) >= 0) {
                            seen[p.id] = 1;
                            dep.push(p.id);
                        }
                    });
                }
            } else {
                (prob.knowledgePoints || []).forEach(function(id) {
                    if (kpById[id] && !seen[id]) { seen[id] = 1; pre.push(id); }
                });
            }
            var centerNode = kp || prob;
            var centerIsProb = !!prob;
            var hasProblemNode = centerIsProb || pre.concat(dep, rel).some(function(id) { return !!probById[id]; });

            var W = 1040, H = 760, cx = W / 2, cy = H / 2;
            var R1 = 220, R2 = 320;
            var pos = {};
            var totalNodes = pre.length + dep.length + rel.length + par.length + chd.length;
            // 邻居很多时（例如大类总述），弧形会挤成一团；改用“中心 + 两列邻居”的布局
            var columnLayout = totalNodes > 12;
            if (columnLayout) cx = 300;

            function placeArc(list, radius, a0, a1) {
                for (var i = 0; i < list.length; i++) {
                    var t = list.length === 1 ? 0.5 : i / (list.length - 1);
                    var a = (a0 + (a1 - a0) * t) * Math.PI / 180;
                    pos[list[i]] = { x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius };
                }
            }
            if (columnLayout) {
                var list = par.concat(pre, chd, dep, rel);
                var perCol = Math.ceil(list.length / 2);
                var colX = [560, 810];
                for (var li = 0; li < list.length; li++) {
                    var col = Math.floor(li / perCol);
                    var rowsInCol = Math.min(perCol, list.length - col * perCol);
                    var row = li - col * perCol;
                    var yy = rowsInCol === 1 ? cy : 90 + (H - 150) * row / (rowsInCol - 1);
                    pos[list[li]] = { x: colX[col], y: yy };
                }
            } else {
                placeArc(pre.concat(par), R1, 110, 250);
                placeArc(dep.concat(chd), R1, -70, 70);
                for (var i = 0; i < rel.length; i++) {
                    var ra = (-90 + i * 360 / rel.length) * Math.PI / 180;
                    pos[rel[i]] = { x: cx + Math.cos(ra) * R2, y: cy + Math.sin(ra) * R2 };
                }
            }

            VIZ_INFO = {};
            var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
            svg += '<defs><marker id="viz-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
                   '<path d="M0,0 L10,5 L0,10 z" fill="rgba(96,165,250,0.9)"/></marker>' +
                   '<marker id="viz-arrow-parent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
                   '<path d="M0,0 L10,5 L0,10 z" fill="rgba(168,85,247,0.9)"/></marker></defs>';

            function edgePoint(a, b, shrinkA, shrinkB) {
                var dx = b.x - a.x, dy = b.y - a.y;
                var len = Math.sqrt(dx * dx + dy * dy) || 1;
                var ux = dx / len, uy = dy / len;
                return {
                    x1: (a.x + ux * shrinkA).toFixed(1), y1: (a.y + uy * shrinkA).toFixed(1),
                    x2: (b.x - ux * shrinkB).toFixed(1), y2: (b.y - uy * shrinkB).toFixed(1)
                };
            }

            pre.forEach(function(id) {
                var e = edgePoint(pos[id], { x: cx, y: cy }, 14, 50);
                svg += '<line class="viz-edge-pre" x1="' + e.x1 + '" y1="' + e.y1 + '" x2="' + e.x2 + '" y2="' + e.y2 + '" marker-end="url(#viz-arrow)"/>';
            });
            dep.forEach(function(id) {
                var e = edgePoint({ x: cx, y: cy }, pos[id], 50, 14);
                svg += '<line class="viz-edge-pre" x1="' + e.x1 + '" y1="' + e.y1 + '" x2="' + e.x2 + '" y2="' + e.y2 + '" marker-end="url(#viz-arrow)"/>';
            });
            par.forEach(function(id) {
                var e = edgePoint(pos[id], { x: cx, y: cy }, 14, 50);
                svg += '<line class="viz-edge-parent" x1="' + e.x1 + '" y1="' + e.y1 + '" x2="' + e.x2 + '" y2="' + e.y2 + '" marker-start="url(#viz-arrow-parent)" marker-end="url(#viz-arrow-parent)"/>';
            });
            chd.forEach(function(id) {
                var e = edgePoint({ x: cx, y: cy }, pos[id], 50, 14);
                svg += '<line class="viz-edge-parent" x1="' + e.x1 + '" y1="' + e.y1 + '" x2="' + e.x2 + '" y2="' + e.y2 + '" marker-start="url(#viz-arrow-parent)" marker-end="url(#viz-arrow-parent)"/>';
            });
            rel.forEach(function(id) {
                var e = edgePoint(pos[id], { x: cx, y: cy }, 14, 38);
                svg += '<line class="viz-edge-rel" x1="' + e.x1 + '" y1="' + e.y1 + '" x2="' + e.x2 + '" y2="' + e.y2 + '"/>';
            });

            function drawNode(item, isProb, x, y, r, isCenter) {
                // 题目节点按难度着色，知识点节点按分类着色
                var st = isProb ? { color: diffColor(item.difficulty), shape: 'dart' } : catStyle(item.category);
                if (isProb) {
                    VIZ_INFO[item.id] = '<b>' + escHtml(item.title) + '</b><br>' +
                        '<span class="t-muted">题目 · ' + escHtml(item.category || '未分类') + ' · ' + escHtml(item.difficulty || '暂未评定') + '</span><br>' +
                        (item.oj ? '<span class="t-muted">' + escHtml(item.oj) + (item.problemId ? ' · ' + escHtml(item.problemId) : '') + '</span><br>' : '') +
                        vizTagHtml(item.tags);
                } else {
                    VIZ_INFO[item.id] = '<b>' + escHtml(item.title) + '</b><br>' +
                        '<span class="t-muted">' + escHtml(item.category) + ' · ' + escHtml(item.subcategory) + '</span><br>' +
                        '<span class="t-muted">作者：' + escHtml(vizAuthors(item)) + '</span><br>' +
                        vizTagHtml(item.tags);
                }
                var click = isCenter ? '' : ' onclick="starJump(\'' + item.id + '\')"';
                var stroke = isCenter ? ' stroke="#f8fafc" stroke-width="2"' : ' stroke="rgba(255,255,255,0.35)" stroke-width="1"';
                var out = '<g class="viz-node' + (isProb ? ' viz-prob' : '') + '" data-id="' + item.id + '"' + click + '>';
                if (isCenter) out += '<circle cx="' + x + '" cy="' + y + '" r="' + (r + 9) + '" fill="' + st.color + '" fill-opacity="0.18"/>';
                out += vizShape(st.shape, x, y, r, st.color).replace('/>', stroke + '/>');
                out += '</g>';
                var anchor = isCenter ? 'middle' : (x < cx ? 'end' : 'start');
                var dx = isCenter ? 0 : (x < cx ? -16 : 16);
                var dy = isCenter ? (r + 34) : 4;
                if (isCenter) {
                    // 中心标题加背板：挡住穿过的关联虚线，保证可读
                    var lw = 0;
                    for (var ci = 0; ci < item.title.length; ci++) {
                        lw += item.title.charCodeAt(ci) > 255 ? 19 : 10.5;
                    }
                    out += '<rect x="' + (x - lw / 2 - 10) + '" y="' + (y + dy - 19) + '" width="' + (lw + 20) + '" height="27" rx="7" fill="rgba(7,11,24,0.92)"/>';
                }
                var labelText = item.title;
                if (!isCenter && columnLayout && labelText.length > 14) labelText = labelText.slice(0, 14) + '…';
                out += '<text class="viz-label' + (isCenter ? ' center' : '') + '" x="' + (x + dx) + '" y="' + (y + dy) + '" text-anchor="' + anchor + '">' + escHtml(labelText) + '</text>';
                return out;
            }

            par.concat(pre, chd, dep, rel).forEach(function(id) {
                var p = pos[id];
                if (probById[id]) svg += drawNode(probById[id], true, p.x, p.y, 10, false);
                else svg += drawNode(kpById[id], false, p.x, p.y, 11, false);
            });
            svg += drawNode(centerNode, centerIsProb, cx, cy, centerIsProb ? 20 : 26, true);
            if (pre.length + dep.length + rel.length + par.length + chd.length === 0) {
                var emptyMsg = centerIsProb ? '该题目暂未登记知识点' : '该知识点暂未登记前置或关联节点';
                svg += '<text class="viz-label" x="' + cx + '" y="' + (cy + 78) + '" text-anchor="middle">' + emptyMsg + '</text>';
            }
            svg += '</svg>';

            document.getElementById('star-title').textContent = '星图 · ' + centerNode.title;
            var legend = '';
            var usedCats = [];
            var usedDiffs = [];
            [centerNode].concat(pre.map(nodeOf), dep.map(nodeOf), rel.map(nodeOf), par.map(nodeOf), chd.map(nodeOf)).forEach(function(k) {
                if (!k) return;
                if (probById[k.id]) {
                    var diff = k.difficulty || '暂未评定';
                    if (usedDiffs.indexOf(diff) < 0) usedDiffs.push(diff);
                    return;
                }
                if (usedCats.indexOf(k.category) < 0) usedCats.push(k.category);
            });
            usedCats.forEach(function(c) {
                legend += '<span><i style="background:' + catStyle(c).color + '"></i>' + escHtml(c) + '</span>';
            });
            usedDiffs.sort(function(a, b) {
                return DIFF_LEVELS.indexOf(a) - DIFF_LEVELS.indexOf(b);
            }).forEach(function(d) {
                legend += '<span><i style="background:' + diffColor(d) + '"></i>题目 · ' + escHtml(d) + '</span>';
            });
            legend += '<span><i style="background:rgba(96,165,250,0.9)"></i>前置→高阶</span>';
            legend += '<span><i style="background:rgba(148,163,184,0.6)"></i>关联（无向）</span>';

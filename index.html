        // ---------- 维恩图 ----------
        function vennHash(s) {
            var h = 0;
            for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
            return h;
        }

        function openVenn() {
            var cats = [];
            PROBLEMS_DATA.forEach(function(p) {
                var c = p.category || '未分类';
                if (cats.indexOf(c) < 0) cats.push(c);
            });
            cats.sort();

            // 先展开浮层并填好图例（图例会换行、改变画布高度），再量画布实际比例
            var venBody = document.getElementById('venn-body');
            document.getElementById('venn-overlay').classList.add('open');
            var lg = '';
            cats.forEach(function(c) {
                lg += '<span><i style="background:' + catStyle(c).color + '"></i>' + escHtml(c) + '</span>';
            });
            lg += '<span style="color:#94a3b8">点色＝难度：</span>';
            DIFF_LEVELS.forEach(function(d) {
                lg += '<span><i style="background:' + diffColor(d) + '"></i>' + escHtml(d) + '</span>';
            });
            document.getElementById('venn-legend').innerHTML = lg;
            var bodyAspect = (venBody.clientWidth || 1500) / Math.max(1, venBody.clientHeight || 800);

            var W = 2400, H = 1400, cx = W / 2, cy = H / 2, PAD = 34;
            var pos = {}, cnt = {};
            cats.forEach(function(c) { cnt[c] = 0; });
            PROBLEMS_DATA.forEach(function(p) {
                var c = p.category || '未分类';
                if (cnt[c] !== undefined) cnt[c]++;
            });
            // 半径按题目数缩放并封顶，避免大圆顶出画布
            cats.forEach(function(c) {
                pos[c] = { x: 0, y: 0, r: Math.min(196, 74 + Math.sqrt(cnt[c] || 1) * 23) };
            });
            // 环形初值 + 轻推松弛 + 边界夹紧，保证所有圆完整落在画布内
            var Rx = 460, Ry = 225;
            cats.forEach(function(c, i) {
                var a = -Math.PI / 2 + i * 2 * Math.PI / cats.length;
                pos[c].x = cx + Math.cos(a) * Rx;
                pos[c].y = cy + Math.sin(a) * Ry;
            });
            for (var it = 0; it < 220; it++) {
                for (var bi = 0; bi < cats.length; bi++) {
                    for (var bj = bi + 1; bj < cats.length; bj++) {
                        var A = pos[cats[bi]], B = pos[cats[bj]];
                        var ddx = B.x - A.x, ddy = B.y - A.y;
                        var dd = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
                        var minD = (A.r + B.r) * 0.72;
                        if (dd < minD) {
                            var push = (minD - dd) / dd * 0.25;
                            A.x -= ddx * push; A.y -= ddy * push;
                            B.x += ddx * push; B.y += ddy * push;
                        }
                    }
                }
                cats.forEach(function(c) {
                    var p = pos[c];
                    p.x = Math.max(p.r + PAD, Math.min(W - p.r - PAD, p.x));
                    p.y = Math.max(p.r + PAD + 24, Math.min(H - p.r - PAD, p.y));
                });
            }
            // 宽屏时把布局横向拉开，充分利用水平空间；窄屏保持圆形聚拢
            var kx = Math.max(1, Math.min(1.55, bodyAspect / 1.5));
            cats.forEach(function(c) {
                var p = pos[c];
                p.x = cx + (p.x - cx) * kx;
                p.x = Math.max(p.r + PAD, Math.min(W - p.r - PAD, p.x));
            });

            var tagCat = {};
            KNOWLEDGE_DATA.forEach(function(k) {
                (k.tags || []).forEach(function(t) {
                    var key = String(t).toLowerCase();
                    if (!tagCat[key]) tagCat[key] = {};
                    tagCat[key][k.category] = 1;
                });
            });

            // 按实际内容包围盒取 viewBox，充分利用浮层空间（避免四周大片留白）
            var bb = { x1: 1e9, y1: 1e9, x2: -1e9, y2: -1e9 };
            cats.forEach(function(c) {
                var p = pos[c];
                bb.x1 = Math.min(bb.x1, p.x - p.r); bb.y1 = Math.min(bb.y1, p.y - p.r);
                bb.x2 = Math.max(bb.x2, p.x + p.r); bb.y2 = Math.max(bb.y2, p.y + p.r);
            });
            var vp = 26;
            var vbW = (bb.x2 - bb.x1) + vp * 2, vbH = (bb.y2 - bb.y1) + vp * 2;
            // 让 viewBox 比例贴合浮层画布，避免单方向出现大片留白
            var aspect = Math.max(1.1, Math.min(2.8, bodyAspect));
            if (vbW / vbH < aspect) vbW = vbH * aspect;
            else vbH = vbW / aspect;
            var vbX = (bb.x1 + bb.x2) / 2 - vbW / 2;
            var vbY = (bb.y1 + bb.y2) / 2 - vbH / 2;

            VIZ_INFO = {};
            var svg = '<svg viewBox="' + vbX.toFixed(0) + ' ' + vbY.toFixed(0) + ' ' + vbW.toFixed(0) + ' ' + vbH.toFixed(0) + '" preserveAspectRatio="xMidYMid meet">';

            cats.forEach(function(c) {
                var p = pos[c], st = catStyle(c);
                var dist = {};
                PROBLEMS_DATA.forEach(function(q) {
                    if ((q.category || '未分类') !== c) return;
                    var d = q.difficulty || '暂未评定';
                    dist[d] = (dist[d] || 0) + 1;
                });
                var distHtml = Object.keys(dist).sort().map(function(d) {
                    return '<span class="t-tag" style="border-left:3px solid ' + diffColor(d) + '">' + escHtml(d) + ' ×' + dist[d] + '</span>';
                }).join('');
                VIZ_INFO['cat:' + c] = '<b>' + escHtml(c) + '</b><br>' +
                    '<span class="t-muted">题目 ' + (cnt[c] || 0) + ' 道</span><br>' + distHtml;
                svg += '<g class="viz-node" data-id="cat:' + escHtml(c) + '">' +
                    '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + p.r.toFixed(1) + '" fill="' + st.color + '" fill-opacity="0.10" stroke="' + st.color + '" stroke-opacity="0.45" stroke-width="1.4"/>' +
                    '</g>';
            });

            // 先按「所属集合组合」分组，再在每组内用向日葵螺旋均匀铺点，避免重叠
            var groups = {}, order = [];
            PROBLEMS_DATA.forEach(function(p) {
                var set = {};
                set[p.category || '未分类'] = 1;
                (p.tags || []).forEach(function(t) {
                    var m = tagCat[String(t).toLowerCase()];
                    if (!m) return;
                    for (var c in m) { if (pos[c]) set[c] = 1; }
                });
                var arr = Object.keys(set).filter(function(c) { return !!pos[c]; });
                if (!arr.length) return;
                if (arr.length > 3) arr = arr.slice(0, 3);
                arr.sort();
                var key = arr.join('|');
                if (!groups[key]) { groups[key] = { cats: arr, items: [] }; order.push(key); }
                groups[key].items.push(p);
            });
            order.sort(function(a, b) { return groups[a].cats.length - groups[b].cats.length; });

            var points = [];
            order.forEach(function(key) {
                var g = groups[key], n = g.items.length;
                var ax = 0, ay = 0;
                g.cats.forEach(function(c) { ax += pos[c].x; ay += pos[c].y; });
                ax /= g.cats.length; ay /= g.cats.length;
                var maxR = g.cats.length === 1 ? pos[g.cats[0]].r * 0.74 : 34;
                var spin = (vennHash(key) % 360) * Math.PI / 180;
                g.items.forEach(function(p, i) {
                    var rr = maxR * Math.sqrt((i + 0.6) / n);
                    var aa = spin + i * 2.399963;
                    points.push({ p: p, x: ax + Math.cos(aa) * rr, y: ay + Math.sin(aa) * rr });
                });
            });

            // 全局斥力松弛：把跨分组撞在一起的点推开，保证每个点可单独悬停
            for (var pit = 0; pit < 80; pit++) {
                var moved = false;
                for (var pi = 0; pi < points.length; pi++) {
                    for (var pj = pi + 1; pj < points.length; pj++) {
                        var pa = points[pi], pb = points[pj];
                        var vx = pb.x - pa.x, vy = pb.y - pa.y;
                        var vd = Math.sqrt(vx * vx + vy * vy);
                        if (vd >= 16) continue;
                        if (vd < 0.01) { vx = 0.7; vy = 0.7; vd = 1; }
                        var mv = (16 - vd) / vd * 0.5;
                        pa.x -= vx * mv; pa.y -= vy * mv;
                        pb.x += vx * mv; pb.y += vy * mv;
                        moved = true;
                    }
                }
                if (!moved) break;
            }

            points.forEach(function(pt) {
                var p = pt.p;
                var color = diffColor(p.difficulty);
                var tagStr = (p.tags || []).slice(0, 6).map(function(t) {
                    return '<span class="t-tag">' + escHtml(t) + '</span>';
                }).join('');
                VIZ_INFO[p.id] = '<b>' + escHtml(p.title) + '</b><br>' +
                    '<span class="t-muted">' + escHtml(p.difficulty || '暂未评定') +
                    (p.oj ? ' · ' + escHtml(p.oj) + (p.problemId && p.problemId !== '-' ? ' ' + escHtml(p.problemId) : '') : '') + '</span><br>' +
                    (p.source ? '<span class="t-muted">来源：' + escHtml(p.source) + '</span><br>' : '') +
                    '<span class="t-muted">作者：' + escHtml(vizAuthors(p)) + '</span><br>' + tagStr;
                svg += '<g class="viz-node" data-id="' + p.id + '" onclick="vennJump(\'' + p.id + '\')">' +
                    '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="7" fill="' + color + '" stroke="rgba(8,12,26,0.85)" stroke-width="1.2"/>' +
                    '</g>';
            });
            cats.forEach(function(c) {
                var p = pos[c];
                // 标签加深色背板，避免被题目点压住看不清
                var lw = 0;
                for (var ci = 0; ci < c.length; ci++) lw += c.charCodeAt(ci) > 255 ? 20 : 11;
                svg += '<rect x="' + (p.x - lw / 2 - 10).toFixed(1) + '" y="' + (p.y - p.r + 5).toFixed(1) + '" width="' + (lw + 20).toFixed(1) + '" height="29" rx="9" fill="rgba(7,11,24,0.72)"/>';
                svg += '<text class="viz-bubble-label" x="' + p.x.toFixed(1) + '" y="' + (p.y - p.r + 26).toFixed(1) + '" text-anchor="middle">' + escHtml(c) + '</text>';
            });
            svg += '</svg>';

            var body = document.getElementById('venn-body');
            body.innerHTML = svg;
            bindVizNodes(body);
        }

        // ===== 数据库专栏增量覆盖 =====
        // 「修改 / 投稿」工单审批后只写数据库，静态 data.js 不会变。
        // 页面打开时按 updated_at 增量拉取已发布专栏：col-* 覆盖正文，sub-* 追加为
        // 新知识点/题目；之后每 60 秒、以及回到前台时各同步一次。
        var DB_SYNC_INTERVAL = 60000;
        var dbSince = (typeof DATA_BUILD_AT !== 'undefined' && DATA_BUILD_AT) ? DATA_BUILD_AT : '';
        var dbAppliedAt = {};
        var dbSyncBusy = false;
        var dbLockMap = {};
        var viewerAuthed = false;
        var viewerIsAdmin = false;
        var viewerName = '';
        var lockStatusReady = false;
        var lockStatusLoading = false;

        // 作者显示名 → 版本文件名 key（用于 col-<id>--<key>）
        var AUTHOR_KEY_BY_NAME = {};
        if (typeof AUTHOR_KEYS !== 'undefined') {
            Object.keys(AUTHOR_KEYS).forEach(function(key) {
                AUTHOR_KEY_BY_NAME[AUTHOR_KEYS[key]] = key;
            });
        }

        // 当前条目/版本对应的数据库 column_key
        function columnKeyForVersion(item, verIdx) {
            if (!item) return null;
            if (String(item.id).indexOf('sub-') === 0) return item.id;
            var versions = item.versions || [];
            var ver = versions[verIdx] || versions[0] || {};
            var author = ver.author || 'world-needs-sunday';
            if (author === 'world-needs-sunday') return 'col-' + item.id;
            var suffix = AUTHOR_KEY_BY_NAME[author];
            return suffix ? ('col-' + item.id + '--' + suffix) : ('col-' + item.id);
        }

        // 有密码的专栏：游客直接拦截；登录用户需在本标签页输入过密码；管理员直接放行
        function isColumnViewLocked(key) {
            if (!key) return false;
            if (!dbLockMap[key]) return false;
            if (viewerIsAdmin) return false;
            if (viewerAuthed) {
                try {
                    if (sessionStorage.getItem('akb_unlock:' + key) === '1') return false;
                } catch (e) {}
            }
            return true;
        }

        function authorNameForVersion(kind, itemId, verIdx) {
            var list = kind === 'prob'
                ? (typeof PROBLEMS_DATA !== 'undefined' ? PROBLEMS_DATA : [])
                : (typeof KNOWLEDGE_DATA !== 'undefined' ? KNOWLEDGE_DATA : []);
            var item = list.find(function(x) { return x.id === itemId; });
            if (!item) return '';
            var idx = (typeof verIdx === 'number' && verIdx >= 0) ? verIdx : 0;
            var ver = (item.versions || [])[idx];
            return ver ? resolveAuthorName(ver.author || 'world-needs-sunday') : '';
        }

        function renderColumnLockGate(kind, itemId, verIdx, key, title) {
            var authorName = authorNameForVersion(kind, itemId, verIdx);
            var authorBadge = authorName && authorProfile(authorName).role === 'admin'
                ? '<span class="admin-badge">管理员</span>'
                : '';
            var authorLine = authorName
                ? '<div class="column-lock-author">' + authorAvatarHtml(authorName, 'author-avatar-sm') +
                  '<span>作者：<strong>' + escHtml(authorName) + '</strong>' + authorBadge + '</span></div>'
                : '';
            if (!viewerAuthed) {
                contentEl.innerHTML =
                    '<div class="column-lock-gate">' +
                        '<div class="lock-icon">🔒</div>' +
                        '<h2>' + escHtml(title || '该专栏') + ' 已设置访问密码</h2>' +
                        authorLine +
                        '<p>游客不能访问有密码的专栏。请先登录，登录后输入专栏密码即可查看。</p>' +
                        '<p class="column-lock-hint"><a href="login.html">去登录</a> · 无密码专栏可直接查看</p>' +
                    '</div>';
                return;
            }
            contentEl.innerHTML =
                '<div class="column-lock-gate">' +
                    '<div class="lock-icon">🔒</div>' +
                    '<h2>' + escHtml(title || '该专栏') + ' 已设置访问密码</h2>' +
                    authorLine +
                    '<p>该专栏需要输入访问密码后才能查看；密码为空则无需输入。</p>' +
                    '<div class="column-lock-form">' +
                        '<input class="column-lock-input" type="password" id="column-unlock-input" placeholder="输入专栏访问密码" autocomplete="off">' +
                        '<button class="column-lock-btn" type="button" id="column-unlock-btn">解锁查看</button>' +
                    '</div>' +
                    '<div class="column-lock-error" id="column-unlock-error"></div>' +
                    '<p class="column-lock-hint">验证通过后，本标签页内可继续查看该专栏。</p>' +
                '</div>';
            var input = document.getElementById('column-unlock-input');
            var btn = document.getElementById('column-unlock-btn');
            function submit() {
                tryUnlockColumn(key, input.value, function() {
                    if (kind === 'prob') {
                        var prob = PROBLEMS_DATA.find(function(p) { return p.id === itemId; });
                        if (prob) renderProbArticle(prob, verIdx);
                    } else {
                        var kp = KNOWLEDGE_DATA.find(function(k) { return k.id === itemId; });
                        if (kp) renderKpArticle(kp, verIdx);
                    }
                });
            }
            btn.addEventListener('click', submit);
            input.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    submit();
                }
            });
            input.focus();
        }

        function tryUnlockColumn(key, password, onSuccess) {
            var errEl = document.getElementById('column-unlock-error');
            var btn = document.getElementById('column-unlock-btn');
            var input = document.getElementById('column-unlock-input');
            if (!viewerAuthed) {
                if (errEl) errEl.textContent = '请先登录后再输入专栏密码';
                return;
            }
            if (!window.supabaseClient) {
                if (errEl) errEl.textContent = 'Supabase 未配置，暂时无法验证密码';
                return;
            }
            if (!password) {
                if (errEl) errEl.textContent = '请输入专栏访问密码';
                return;
            }
            if (btn) btn.disabled = true;
            if (errEl) errEl.textContent = '正在验证…';
            window.supabaseClient.rpc('verify_column_password', {
                p_key: key,
                p_password: password
            }).then(function(res) {
                if (btn) btn.disabled = false;
                if (res.error) {
                    if (errEl) errEl.textContent = '验证失败：' + res.error.message;
                    return;
                }
                if (!res.data) {
                    if (errEl) errEl.textContent = '密码不正确，请重试';
                    if (input) {
                        input.value = '';
                        input.focus();
                    }
                    return;
                }
                try { sessionStorage.setItem('akb_unlock:' + key, '1'); } catch (e) {}
                dbLockMap[key] = false;
                onSuccess();
            }).catch(function(err) {
                if (btn) btn.disabled = false;
                if (errEl) errEl.textContent = '验证异常：' + (err && err.message ? err.message : err);
            });
        }

        // 只在需要时重绘当前文章（锁状态/登录状态变化后）
        function rerenderCurrentArticle() {
            if (currentMode === 'author') {
                refreshAuthorViews();

            if (!currentId) return;
            if (currentMode === 'prob' && typeof PROBLEMS_DATA !== 'undefined') {
                var prob = PROBLEMS_DATA.find(function(p) { return p.id === currentId; });
                if (prob) {
                    renderProbArticle(prob, Math.max(0, Math.min(currentProbVer, (prob.versions || []).length - 1)));
                }
            } else if (currentMode === 'kp') {
                var kp = KNOWLEDGE_DATA.find(function(k) { return k.id === currentId; });
                if (kp) {
                    renderKpArticle(kp, Math.max(0, Math.min(currentVer, (kp.versions || []).length - 1)));
                }
            }
        }

        // 全量读取 608 条专栏的 locked（很小），用于游客首次进入时判断
        function loadColumnLocks() {
            var client = window.supabaseClient;
            if (!client) {
                lockStatusReady = true;
                rerenderCurrentArticle();
                return Promise.resolve();
            }
            if (lockStatusLoading) return Promise.resolve();
            lockStatusLoading = true;
            return client.from('published_columns').select('column_key,locked').then(function(res) {
                if (res.error) {
                    console.warn('[AKB] 读取专栏密码状态失败：' + res.error.message);
                    return;
                }
                (res.data || []).forEach(function(row) {
                    dbLockMap[row.column_key] = row.locked === true;
                });
            }).catch(function(err) {
                console.warn('[AKB] 读取专栏密码状态异常：' + (err && err.message ? err.message : err));
            }).then(function() {
                lockStatusLoading = false;
                lockStatusReady = true;
                rerenderCurrentArticle();
            });
        }

        // 读取审批通过的修补工单（视图已去重、已排除 sub-*）
        function loadEditCredits() {
            var client = window.supabaseClient;
            if (!client) return Promise.resolve();
            if (editCreditsLoading) return Promise.resolve();
            editCreditsLoading = true;
            return client.from('author_edit_credits').select('*').then(function(res) {
                if (res.error) {
                    console.warn('[AKB] 读取修补贡献失败：' + res.error.message);
                    editCreditsError = true;
                    editCreditsReady = true;
                    refreshAuthorViews();
                    return;
                }
                var next = Array.isArray(res.data) ? res.data : [];
                var wasReady = editCreditsReady;
                var changed = JSON.stringify(next) !== JSON.stringify(EDIT_CREDITS);
                EDIT_CREDITS = next;
                editCreditsError = false;
                editCreditsReady = true;
                if (changed || !wasReady) refreshAuthorViews();
            }).catch(function(err) {
                console.warn('[AKB] 读取修补贡献异常：' + (err && err.message ? err.message : err));
                editCreditsError = true;
                editCreditsReady = true;
                refreshAuthorViews();
            }).then(function() {
                editCreditsLoading = false;
            });
        }

        // 读取活跃作者头像 / 签名 / 战绩（公开视图 author_profiles）
        // 兼容只执行到 phase15 的数据库：缺 signature/honors 时退回只读头像。
        function loadAuthorProfiles() {
            var client = window.supabaseClient;
            if (!client) return Promise.resolve();
            if (authorProfilesLoading) return Promise.resolve();
            authorProfilesLoading = true;
            return client.from('author_profiles')
                .select('author_name,avatar_url,signature,honors,role')
                .then(function(res) {
                    if (res.error && /role/i.test(res.error.message || '')) {
                        return client.from('author_profiles').select('author_name,avatar_url,signature,honors').then(function(res2) {
                            if (res2.error) {
                                return client.from('author_profiles').select('author_name,avatar_url').then(function(res3) {
                                    return { data: res3.data || [], error: res3.error, hasMeta: false };
                                });
                            }
                            return { data: res2.data || [], error: null, hasMeta: true };
                        });
                    }
                    if (res.error && /signature|honors/i.test(res.error.message || '')) {
                        return client.from('author_profiles').select('author_name,avatar_url').then(function(res2) {
                            return { data: res2.data || [], error: res2.error, hasMeta: false };
                        });
                    }
                    return { data: res.data || [], error: res.error, hasMeta: true };
                })
                .then(function(result) {
                    if (result.error) {
                        if (!authorProfilesWarned) {
                            authorProfilesWarned = true;
                            console.warn('[AKB] 读取作者资料失败：' + result.error.message);
                        }
                        return;
                    }
                    var avatarMap = {};
                    var profileMap = {};
                    result.data.forEach(function(row) {
                        if (!row || !row.author_name) return;
                        var canonical = resolveAuthorName(row.author_name);
                        if (row.avatar_url) avatarMap[canonical] = row.avatar_url;
                        if (result.hasMeta) {
                            profileMap[canonical] = {
                                signature: row.signature || '',
                                honors: Array.isArray(row.honors) ? row.honors : [],
                                role: row.role || ''
                            };
                        }
                    });
                    var changed = JSON.stringify(avatarMap) !== JSON.stringify(AUTHOR_AVATARS) ||
                        JSON.stringify(profileMap) !== JSON.stringify(DB_AUTHOR_PROFILES);
                    AUTHOR_AVATARS = avatarMap;
                    DB_AUTHOR_PROFILES = profileMap;
                    authorProfilesWarned = false;
                    if (changed) refreshAuthorViews();
                })
                .catch(function(err) {
                    if (!authorProfilesWarned) {
                        authorProfilesWarned = true;
                        console.warn('[AKB] 读取作者资料异常：' + (err && err.message ? err.message : err));
                    }
                })
                .then(function() {
                    authorProfilesLoading = false;
                });
        }

        // 修补数据到达后，只重绘作者相关视图
        function refreshAuthorViews() {
            if (currentMode !== 'author') return;
            buildAuthorSidebar(searchInput.value);
            if (currentAuthor) {
                var pack = sortedAuthors();
                var target = null;
                pack.authors.forEach(function(a) { if (a.name === currentAuthor) target = a; });
                if (target) {
                    renderAuthorProfile(target, pack.totalAll);
                    return;
                }
            }
            showAuthors();
        }

        // 登录用户需输入专栏密码；管理员可直接查看任何人的专栏
        function refreshViewerAuth() {
            if (!window.AKB || !window.AKB.getUser) return Promise.resolve();
            return window.AKB.getUser().then(function(user) {
                var was = viewerAuthed;
                var wasAdmin = viewerIsAdmin;
                var wasName = viewerName;
                viewerAuthed = !!user;
                if (!user) {
                    viewerIsAdmin = false;
                    viewerName = '';
                    if (was !== viewerAuthed || wasAdmin !== viewerIsAdmin || wasName !== viewerName) rerenderCurrentArticle();
                    return null;
                }
                return window.AKB.getProfile().then(function(profile) {
                    viewerIsAdmin = !!(profile && profile.role === 'admin');
                    viewerName = profile ? (profile.nickname || '') : '';
                    if (was !== viewerAuthed || wasAdmin !== viewerIsAdmin || wasName !== viewerName) rerenderCurrentArticle();
                });
            }).catch(function() {});
        }

        // 关系目标（col-xxx / col-xxx--作者）→ 静态条目 id
        function relationBaseId(target) {
            var text = String(target || '');
            if (text.indexOf('col-') === 0) text = text.slice(4);
            var idx = text.indexOf('--');
            return idx >= 0 ? text.slice(0, idx) : text;
        }

        // 数据库关系写回静态图：sequence→前置，related→关联，parent-child→父栏目；题目→知识点
        // override=true 时即使 relations 为空也清空静态关系（人工清空）
        function applyDbRelations(item, relations, isProblem, override) {
            if (!item) return false;
            var list = Array.isArray(relations) ? relations : [];
            if (!list.length && override !== true) return false;
            var pre = [];
            var rel = [];
            var parent = '';
            list.forEach(function(entry) {
                if (!entry || !entry.target) return;
                var id = relationBaseId(entry.target);
                if (!id || id === item.id) return;
                if (isProblem) {
                    if (pre.indexOf(id) < 0) pre.push(id);
                    return;
                }
                if (entry.type === 'sequence') {
                    if (pre.indexOf(id) < 0) pre.push(id);
                } else if (entry.type === 'parent-child') {
                    if (!parent) parent = id;
                } else if (rel.indexOf(id) < 0) {
                    rel.push(id);
                }
            });
            if (isProblem) {
                item.knowledgePoints = pre;
            } else {
                item.prerequisites = pre;
                item.related = rel;
                item.parent = parent;
            }
            return true;
        }

        // col-<base> / col-<base>--<作者key> → 静态条目与版本下标
        function findDbColumnTarget(key) {
            if (key.indexOf('col-') !== 0) return null;
            var rest = key.slice(4);
            var dash = rest.indexOf('--');
            var baseId = dash >= 0 ? rest.slice(0, dash) : rest;
            var suffix = dash >= 0 ? rest.slice(dash + 2) : '';
            var item = null;
            var kind = '';
            if (typeof KNOWLEDGE_DATA !== 'undefined') {
                item = KNOWLEDGE_DATA.find(function(k) { return k.id === baseId; });
                if (item) kind = 'knowledge';
            }
            if (!item && typeof PROBLEMS_DATA !== 'undefined') {
                item = PROBLEMS_DATA.find(function(p) { return p.id === baseId; });
                if (item) kind = 'problem';
            }
            if (!item) return null;
            var author = suffix
                ? ((typeof AUTHOR_KEYS !== 'undefined' && AUTHOR_KEYS[suffix]) || suffix)
                : 'world-needs-sunday';
            var versions = item.versions || [];
            var verIdx = versions.findIndex(function(v) {
                return resolveAuthorName(v.author || '') === resolveAuthorName(author);
            });
            return { item: item, verIdx: verIdx, kind: kind, author: author };
        }

        // 数据库里的新投稿（sub-*）→ 追加到静态数据数组
        function addDbSubmissionColumn(row) {
            var isProblem = row.kind === 'problem';
            var list = isProblem
                ? (typeof PROBLEMS_DATA !== 'undefined' ? PROBLEMS_DATA : null)
                : (typeof KNOWLEDGE_DATA !== 'undefined' ? KNOWLEDGE_DATA : null);
            if (!list) return false;
            var author = row.author_name || 'world-needs-sunday';
            var tags = Array.isArray(row.tags) ? row.tags : [];
            var content = row.content || '';
            var version = {
                author: author,
                content: content,
                codePath: '',
                timeComplexity: '未知',
                spaceComplexity: '未知',
                tags: tags,
                source: ''
            };
            var exists = list.find(function(x) { return x.id === row.column_key; });
            if (exists) {
                var existingVersion = exists.versions && exists.versions[0];
                if (existingVersion) {
                    existingVersion.content = content;
                    existingVersion.tags = tags;
                } else {
                    exists.versions = [version];
                }
                exists.content = content;
                if (row.column_name) exists.title = row.column_name;
                if (row.category) exists.category = row.category;
                if (Array.isArray(row.tags)) exists.tags = row.tags;
                if (isProblem && row.difficulty) exists.difficulty = row.difficulty;
                exists._searchBlob = undefined;
                return true;
            }
            var item = {
                id: row.column_key,
                title: row.column_name || row.column_key,
                category: row.category || '未分类',
                subcategory: '投稿',
                subSubcategory: '',
                hub: false,
                versions: [version],
                content: content,
                timeComplexity: '未知',
                spaceComplexity: '未知',
                tags: tags,
                codePath: '',
                prerequisites: [],
                related: [],
                parent: ''
            };
            if (isProblem) {
                item.difficulty = row.difficulty || '暂未评定';
                item.cfRating = '';
                item.oj = '';
                item.problemId = '';
                item.knowledgePoints = [];
            }
            applyDbRelations(item, row.relations, isProblem, row.relations_override === true);
            list.push(item);
            return true;
        }

        function applyDbColumn(row) {
            if (!row || !row.column_key) return false;
            if (dbAppliedAt[row.column_key] === row.updated_at) return false;
            var key = row.column_key;
            var changed = false;
            if (key.indexOf('sub-') === 0) {
                changed = addDbSubmissionColumn(row);
            } else if (key.indexOf('col-') === 0) {
                var target = findDbColumnTarget(key);
                if (target && target.verIdx >= 0) {
                    var ver = target.item.versions[target.verIdx];
                    ver.content = row.content || '';
                    if (Array.isArray(row.tags)) ver.tags = row.tags;
                    // 主版本同步兼容字段，并让搜索索引与目录标题失效重建
                    if (target.verIdx === 0) {
                        target.item.content = ver.content;
                        if (row.column_name) {
                            var newTitle = row.column_name;
                            var primaryAuthor = (target.item.versions[0] || {}).author || '';
                            var suffix = ' · ' + primaryAuthor;
                            if (key.indexOf('--') >= 0 && primaryAuthor &&
                                newTitle.slice(-suffix.length) === suffix) {
                                newTitle = newTitle.slice(0, -suffix.length);
                            }
                            target.item.title = newTitle;
                        }
                        if (Array.isArray(row.tags)) target.item.tags = row.tags;
                        if (row.category) target.item.category = row.category;
                        if (row.kind === 'problem') target.item.difficulty = row.difficulty || '暂未评定';
                    }
                    applyDbRelations(target.item, row.relations, target.kind === 'problem', row.relations_override === true);
                    target.item._searchBlob = undefined;
                    changed = true;
                } else if (target && key.indexOf('--') >= 0) {
                    // 已有专栏新增作者版本：数据库行 col-<base>--<author> 追加到 versions[]
                    var newAuthor = row.author_name || target.author || '';
                    if (newAuthor) {
                        var baseLevel = (target.item.versions[0] || {}).level || 'A';
                        target.item.versions = target.item.versions || [];
                        target.item.versions.push({
                            author: newAuthor,
                            content: row.content || '',
                            codePath: '',
                            timeComplexity: '未知',
                            spaceComplexity: '未知',
                            tags: Array.isArray(row.tags) ? row.tags : [],
                            source: '',
                            level: baseLevel
                        });
                        applyDbRelations(target.item, row.relations, target.kind === 'problem', row.relations_override === true);
                        target.item._searchBlob = undefined;
                        changed = true;
                    }
                }
            }
            if (changed) dbAppliedAt[key] = row.updated_at;
            return changed;
        }

        // 覆盖后重绘当前视图（保留阅读位置与版本选择）
        function refreshAfterDbSync() {
            if (currentMode === 'author') {
                refreshAuthorViews();
                updateFooter();
                return;
            }
            if (currentMode === 'prob') {
                buildProblemSidebar(searchInput.value);
                if (currentId) {
                    var prob = PROBLEMS_DATA.find(function(p) { return p.id === currentId; });
                    if (prob) {
                        document.title = prob.title + ' · 算法知识点查询系统';
                        renderProbArticle(prob, Math.max(0, Math.min(currentProbVer, (prob.versions || []).length - 1)));
                    }
                } else {
                    handleRoute();
                }
            } else {
                buildSidebar(searchInput.value);
                if (currentId) {
                    var kp = KNOWLEDGE_DATA.find(function(k) { return k.id === currentId; });
                    if (kp) {
                        document.title = kp.title + ' · 算法知识点查询系统';
                        renderKpArticle(kp, Math.max(0, Math.min(currentVer, (kp.versions || []).length - 1)));
                    }
                } else {
                    handleRoute();
                }
            }
            renderTagFilter();
            updateFooter();
        }

        function syncPublishedColumns() {
            var client = window.supabaseClient;
            if (!client || dbSyncBusy || !dbSince) return Promise.resolve();
            dbSyncBusy = true;
            var baseSelect = 'column_key,column_name,category,kind,difficulty,tags,content,author_name,updated_at,locked';
            function fetchRows(level) {
                var select = baseSelect;
                if (level >= 1) select += ',relations';
                if (level >= 2) select += ',relations_override';
                return client
                    .from('published_columns')
                    .select(select)
                    .gt('updated_at', dbSince)
                    .order('updated_at', { ascending: true });
            }
            return fetchRows(2)
                .then(function(res) {
                    // phase19 未执行时逐级回退：relations_override → relations → 基础字段
                    if (res.error && /relation/i.test(res.error.message || '')) {
                        return fetchRows(1);
                    }
                    return res;
                })
                .then(function(res) {
                    if (res.error && /relation/i.test(res.error.message || '')) {
                        return fetchRows(0);
                    }
                    return res;
                })
                .then(function(res) {
                    if (res.error) {
                        console.warn('[AKB] 专栏增量同步失败：' + res.error.message);
                        return;
                    }
                    var rows = res.data || [];
                    var changed = 0;
                    rows.forEach(function(row) {
                        if (row.column_key) dbLockMap[row.column_key] = row.locked === true;
                        if (applyDbColumn(row)) changed++;
                    });
                    if (rows.length) dbSince = rows[rows.length - 1].updated_at;
                    if (changed) {
                        console.info('[AKB] 已从数据库同步 ' + changed + ' 条专栏更新');
                        refreshAfterDbSync();
                    }
                })
                .catch(function(err) {
                    console.warn('[AKB] 专栏增量同步异常：' + (err && err.message ? err.message : err));
                })
                .then(function() { dbSyncBusy = false; });
        }

        function startDbSync() {
            refreshViewerAuth();
            loadColumnLocks();
            loadEditCredits();
            loadAuthorProfiles();
            syncPublishedColumns();
            var tick = 0;
            setInterval(function() {
                if (document.visibilityState !== 'visible') return;
                syncPublishedColumns();
                tick++;
                // 密码状态与作者头像变化不会更新 columns.updated_at，每 5 分钟补拉一次
                if (tick % 5 === 0) {
                    loadColumnLocks();
                    loadAuthorProfiles();
                }
            }, DB_SYNC_INTERVAL);
            // 作者页的贡献数字：30 秒轮询，数据变化才重绘
            setInterval(function() {
                if (document.visibilityState !== 'visible') return;
                if (currentMode === 'author') loadEditCredits();
            }, 30000);
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState !== 'visible') return;
                refreshViewerAuth();
                loadColumnLocks();
                loadEditCredits();
                loadAuthorProfiles();
                syncPublishedColumns();
            });
        }

        // ===== Start =====
        init();
        startDbSync();
    </script>

                <span class="tag-modal-close" onclick="closeTagModal()">✕</span>

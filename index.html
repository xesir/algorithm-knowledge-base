            html += '</div>';
            contentEl.innerHTML = html;
            contentEl.scrollTop = 0;

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        // ===== Mode Switch =====
        function switchMode(mode) {
            if (mode === currentMode) return;
            currentMode = mode;
            document.getElementById('mode-kp').classList.toggle('active', mode === 'kp');
            document.getElementById('mode-prob').classList.toggle('active', mode === 'prob');
            searchInput.value = '';
            selectedTags.clear();
            renderTagFilter();
            updateFooter();
            if (mode === 'kp') {
                buildSidebar();
                searchInput.placeholder = '搜索知识点... (按 / 聚焦)';
                showCatalog();
            } else {
                buildProblemSidebar();
                searchInput.placeholder = '搜索题目... (按 / 聚焦)';
                showProblemCatalog();
            }
        }

        function updateFooter() {
            var count, label;
            if (currentMode === 'kp') {
                count = KNOWLEDGE_DATA.length;
                label = '个知识点';
            } else {
                count = (typeof PROBLEMS_DATA !== 'undefined') ? PROBLEMS_DATA.length : 0;
                label = '个题目';
            }
            // 整块重写，避免再引用被 innerHTML 替换掉的旧节点
            document.querySelector('.sidebar-footer').innerHTML =
                '<span id="kp-count">' + count + '</span> ' + label;
        }

        // ===== Build Problem Sidebar =====
        function buildProblemSidebar(filter) {
            filter = filter || '';
            var hasFilter = filter || selectedTags.size > 0;
            if (typeof PROBLEMS_DATA === 'undefined' || PROBLEMS_DATA.length === 0) {
                sidebarNav.innerHTML = '<div class="no-results">暂无题目，请添加题目到 problems/ 目录</div>';
                return;
            }

            var tree = {};

            var q = filter ? filter.toLowerCase() : '';

            PROBLEMS_DATA.forEach(function(prob) {
                if (!matchesTagFilter(prob)) return;
                // 搜索命中范围：标题 / ID / 分类 / OJ / 题号 / 难度 / 标签 / 正文
                if (q && searchBlob(prob).indexOf(q) < 0) return;
                var cat = prob.category || '未分类';
                if (!tree[cat]) tree[cat] = [];
                tree[cat].push(prob);
            });

            var html = '';
            var cats = Object.keys(tree).sort();

            if (cats.length === 0 && filter) {
                html = '<div class="no-results">未找到匹配的题目</div>';
                sidebarNav.innerHTML = html;
                return;
            }

            cats.forEach(function(cat) {
                var probs = tree[cat];
                var expanded = hasFilter ? ' expanded' : '';

                html += '<div class="category' + expanded + '">';
                html += '<div class="category-header" onclick="this.parentElement.classList.toggle(\'expanded\')">';
                html += '<span class="chevron">▼</span>';
                html += '<span class="category-name">' + escHtml(cat) + '</span>';
                html += '<span class="category-count">' + probs.length + '</span>';
                html += '</div>';
                html += '<div class="category-body">';

                probs.forEach(function(prob) {
                    var active = currentId === prob.id ? ' active' : '';
                    var label = prob.title;
                    if (prob.difficulty) {
                        label = diffMeta(prob.difficulty).icon + ' ' + label;
                    }
                    html += '<div class="kp-item' + active + '" onclick="selectProblem(\'' + prob.id + '\')" title="' + escAttr(prob.title) + '">' + escHtml(label) + '</div>';
                });

                html += '</div></div>';
            });

            sidebarNav.innerHTML = html;
        }

        // ===== Select Problem =====
        var currentProb = null;
        var currentProbVer = 0;

        function selectProblem(id) {
            var prob = PROBLEMS_DATA.find(function(p) { return p.id === id; });
            if (!prob) return;
            currentProb = prob;
            currentProbVer = 0; // build.js 已把主版本（站主优先，否则时间优先）放在 versions[0]
            document.title = prob.title + ' · 算法知识点查询系统';

            currentId = id;

            renderProbArticle(prob, currentProbVer);
            finishProblemRender(id);
        }

        function switchProbVersion(i) {
            if (!currentProb || !currentProb.versions || i < 0 || i >= currentProb.versions.length) return;
            currentProbVer = i;
            renderProbArticle(currentProb, i);
        }

        function finishProblemRender(id) {
            // Update URL
            location.hash = id;

            // Update sidebar active
            buildProblemSidebar(searchInput.value);
            revealActiveInSidebar();

            // Scroll to top
            contentEl.scrollTop = 0;

            // Close sidebar on mobile
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function renderProbArticle(prob, verIdx) {
            var versions = prob.versions || [{
                author: '站主', content: prob.content, codePath: prob.codePath,
                timeComplexity: prob.timeComplexity, spaceComplexity: prob.spaceComplexity,
                tags: prob.tags, source: prob.source
            }];
            var ver = versions[verIdx];

            // Version tabs（站主 + 所有已知作者；缺版本的置灰）
            var tabsHtml = '<div class="version-tabs">';
            (typeof AUTHORS !== 'undefined' ? AUTHORS : ['站主']).forEach(function(author) {
                var vi = versions.findIndex(function(v) { return v.author === author; });
                var cls = 'version-tab' + (vi === verIdx ? ' active' : '') + (vi < 0 ? ' disabled' : '');
                var on = (vi >= 0) ? ' onclick="switchProbVersion(' + vi + ')"' : '';
                tabsHtml += '<button class="' + cls + '"' + on + '>' + escHtml(author) + '</button>';
            });
            tabsHtml += '</div>';

            // Meta bar
            var diffClass = diffMeta(prob.difficulty).cls;

            var metaHtml = '<div class="meta-bar">';
            metaHtml += '<span class="badge ' + diffClass + '"> difficulty: ' + escHtml(prob.difficulty) + '</span>';
            var cfVal = prob.cfRating === undefined || prob.cfRating === null || prob.cfRating === '' ? 'NaN' : String(prob.cfRating);
            var cfCls = /^\d+$/.test(cfVal) ? 'badge-cf' : 'badge-cf-na';
            metaHtml += '<span class="badge ' + cfCls + '"> 难度评分: ' + escHtml(cfVal) + '</span>';
            if (prob.oj) {
                metaHtml += '<span class="badge badge-oj">' + escHtml(prob.oj) + '</span>';
            }
            if (prob.problemId) {
                metaHtml += '<span class="badge badge-pid">' + escHtml(prob.problemId) + '</span>';
            }
            metaHtml += '<span class="badge badge-time">⏱ ' + escHtml(ver.timeComplexity || '未知') + '</span>';
            metaHtml += '<span class="badge badge-space">💾 ' + escHtml(ver.spaceComplexity || '未知') + '</span>';
            if (ver.tags && Array.isArray(ver.tags)) {
                ver.tags.forEach(function(tag) {
                    metaHtml += '<span class="tag">' + escHtml(tag) + '</span>';
                });
            }
            if (ver.source) {
                metaHtml += '<span class="badge badge-source">👤 ' + escHtml(ver.source) + '</span>';
            }
            metaHtml += '</div>';

            // Render content: 三步法保护 LaTeX（实现见 renderMarkdownWithMath）
            var contentHtml = '';
            try {
                contentHtml = renderMarkdownWithMath(ver.content);
            } catch(e) {
                contentHtml = '<p>内容渲染出错: ' + escHtml(e.message) + '</p>';
            }

            // Code section
            var codeHtml = '';
            if (ver.codePath && typeof CODE_DATA !== 'undefined' && CODE_DATA[ver.codePath]) {
                codeHtml = '<div class="code-section">' +
                    '<div class="code-header">' +
                    '<span class="code-filename">📄 ' + escHtml(ver.codePath.split('\\').pop()) + '</span>' +
                    '<button class="copy-btn" onclick="copyCode(this)">📋 复制</button>' +
                    '</div>' +
                    '<pre><code class="language-cpp" id="code-block"></code></pre>' +
                    '</div>';
            }

            // Nav buttons
            var idx = PROBLEMS_DATA.findIndex(function(p) { return p.id === prob.id; });
            var navHtml = '<div class="nav-buttons">';
            if (idx > 0) {
                navHtml += '<button class="nav-btn nav-prev" onclick="selectProblem(\'' + PROBLEMS_DATA[idx-1].id + '\')" title="' + escAttr(PROBLEMS_DATA[idx-1].title) + '">← ' + escHtml(PROBLEMS_DATA[idx-1].title) + '</button>';
            } else {
                navHtml += '<span></span>';
            }
            if (idx < PROBLEMS_DATA.length - 1) {
                navHtml += '<button class="nav-btn nav-next" onclick="selectProblem(\'' + PROBLEMS_DATA[idx+1].id + '\')" title="' + escAttr(PROBLEMS_DATA[idx+1].title) + '">' + escHtml(PROBLEMS_DATA[idx+1].title) + ' →</button>';
            } else {
                navHtml += '<span></span>';
            }
            navHtml += '</div>';

            // Assemble
            contentEl.innerHTML =
                '<article class="article">' +
                '<h1>' + escHtml(prob.title) + '</h1>' +
                tabsHtml +
                metaHtml +
                '<div class="markdown-body">' + contentHtml + '</div>' +
                codeHtml +
                navHtml +
                '</article>';

            // Set code content safely
            var codeBlock = document.getElementById('code-block');
            if (codeBlock && ver.codePath && CODE_DATA[ver.codePath]) {
                codeBlock.textContent = CODE_DATA[ver.codePath];
                hljs.highlightElement(codeBlock);
            }

            // Highlight code blocks in content
            contentEl.querySelectorAll('.markdown-body pre code').forEach(function(block) {
                hljs.highlightElement(block);
            });

            // Render math fallback
            try {
                renderMathInElement(contentEl, {
                    delimiters: [
                        {left: '\\(', right: '\\)', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'option', 'annotation', 'math'],
                    throwOnError: false,
                    errorColor: '#cc0000'
                });
            } catch(e) {
                console.warn('KaTeX render error:', e);
            }
        }

                var probs = tree[cat];
                html += '<div class="catalog-category">';
                html += '<div class="catalog-category-header" onclick="this.parentElement.classList.toggle(\'expanded\')">';
                html += '<div class="catalog-category-header-left">';
                html += '<span class="catalog-category-chevron">▶</span>';
                html += '<span class="catalog-category-name">' + escHtml(cat) + '</span>';
                html += '<span class="catalog-category-count">' + probs.length + '</span>';
                html += '</div>';
                html += '</div>';
                html += '<div class="catalog-category-body">';
                html += '<div class="catalog-sub-grid">';
                html += '<div class="catalog-subcard" style="grid-column: 1 / -1;">';
                html += '<ul class="catalog-kp-list">';
                probs.forEach(function(prob) {
                    var diffIcon = diffMeta(prob.difficulty).icon;
                    var ojLabel = prob.oj ? ' [' + escHtml(prob.oj) + (prob.problemId ? ' ' + escHtml(prob.problemId) : '') + ']' : '';
                    var cfTxt = String(prob.cfRating === undefined || prob.cfRating === null || prob.cfRating === '' ? 'NaN' : prob.cfRating);
                    var cfTag = /^\d+$/.test(cfTxt) ? '<span style="color:#4f46e5;font-size:0.72rem;margin-left:6px;">评分 ' + escHtml(cfTxt) + '</span>' : '';
                    html += '<li class="catalog-kp-item" onclick="selectProblem(\'' + prob.id + '\')" title="' + escAttr(prob.title) + '">' +
                        diffIcon + ' ' + escHtml(prob.title) + '<span style="color:var(--text-secondary);font-size:0.75rem;">' + ojLabel + '</span>' + cfTag + '</li>';
                });
                html += '</ul></div>';
                html += '</div></div></div>';
            });

            html += '</div>';
            contentEl.innerHTML = html;
            contentEl.scrollTop = 0;

            document.getElementById('sidebar').classList.remove('open');
        }

        // ===== Toggle Dark =====
        function toggleDark() {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').textContent = isDark ? '☀️' : '🌙';
        }

        // ===== Keyboard =====
        function handleKeyboard(e) {
            // '/' focuses search
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
                return;
            }
            // Escape clears search
            if (e.key === 'Escape' && document.activeElement === searchInput) {
                searchInput.value = '';
                if (currentMode === 'kp') buildSidebar();
                else buildProblemSidebar();
                searchInput.blur();
                return;
            }
            // Alt+Left/Right for prev/next
            if (e.altKey && currentId) {
                if (currentMode === 'kp') {
                    var idx = KNOWLEDGE_DATA.findIndex(function(k) { return k.id === currentId; });
                    if (e.key === 'ArrowLeft' && idx > 0) {
                        e.preventDefault();
                        selectKP(KNOWLEDGE_DATA[idx-1].id);
                    }
                    if (e.key === 'ArrowRight' && idx < KNOWLEDGE_DATA.length - 1) {
                        e.preventDefault();
                        selectKP(KNOWLEDGE_DATA[idx+1].id);
                    }
                } else if (currentMode === 'prob' && typeof PROBLEMS_DATA !== 'undefined') {
                    var idx = PROBLEMS_DATA.findIndex(function(p) { return p.id === currentId; });
                    if (e.key === 'ArrowLeft' && idx > 0) {
                        e.preventDefault();
                        selectProblem(PROBLEMS_DATA[idx-1].id);
                    }
                    if (e.key === 'ArrowRight' && idx < PROBLEMS_DATA.length - 1) {
                        e.preventDefault();
                        selectProblem(PROBLEMS_DATA[idx+1].id);
                    }
                }
            }
        }

        // ===== Helpers =====
        function renderKpCard(kp) {
            return '<div class="subcategory-kp-card" onclick="selectKP(\'' + kp.id + '\')" title="' + escAttr(kp.title) + '">' + escHtml(kp.title) + '</div>';
        }

        // 洛谷评级 → 图标 / 徽章样式（配色与洛谷一致）/ 统计分组
        function diffMeta(d) {
            switch (d) {
                case '入门': return { icon: '🟥', cls: 'badge-difficulty-0', group: 'easy' };
                case '普及−': return { icon: '🟧', cls: 'badge-difficulty-1', group: 'easy' };
                case '普及/提高−': return { icon: '🟨', cls: 'badge-difficulty-2', group: 'medium' };
                case '普及+/提高−': return { icon: '🟩', cls: 'badge-difficulty-3', group: 'medium' };
                case '提高': return { icon: '🟦', cls: 'badge-difficulty-4', group: 'hard' };
                case '提高+/省选−': return { icon: '🔵', cls: 'badge-difficulty-5', group: 'hard' };
                case '省选/NOI−': return { icon: '🟪', cls: 'badge-difficulty-6', group: 'hard' };
                case 'NOI/NOI+/CTSC': return { icon: '⬛', cls: 'badge-difficulty-7', group: 'hard' };
                default: return { icon: '⬜', cls: 'badge-difficulty-na', group: 'unknown' };
            }
        }

        function escHtml(text) {
            if (!text) return '';
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function escAttr(text) {
            if (!text) return '';
            return text.replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ===== 可视化：星图 / 维恩图 =====
        var VIZ_PALETTE = ['#ef4444', '#f59e0b', '#22c55e', '#38bdf8', '#a855f7', '#ec4899', '#14b8a6', '#f97316', '#6366f1', '#84cc16'];
        var VIZ_SHAPES = ['circle', 'square', 'diamond', 'triangle', 'hex', 'star'];
        var CAT_STYLE_CACHE = null;
        var VIZ_INFO = {};
        var vizTipTimer = null;

        function catStyle(cat) {
            if (!CAT_STYLE_CACHE) {
                CAT_STYLE_CACHE = {};
                var cats = [];
                KNOWLEDGE_DATA.forEach(function(k) {
                    if (cats.indexOf(k.category) < 0) cats.push(k.category);
                });
                cats.sort();
                cats.forEach(function(c, i) {
                    CAT_STYLE_CACHE[c] = {
                        color: VIZ_PALETTE[i % VIZ_PALETTE.length],
                        shape: VIZ_SHAPES[i % VIZ_SHAPES.length]
                    };
                });
            }
            return CAT_STYLE_CACHE[cat] || { color: '#94a3b8', shape: 'circle' };
        }

        function diffColor(d) {
            var map = {
                '入门': '#FE4C61', '普及−': '#F39C11', '普及/提高−': '#FFC116',
                '普及+/提高−': '#52C41A', '提高': '#13C2C2', '提高+/省选−': '#3498DB',
                '省选/NOI−': '#9D3DCF', 'NOI/NOI+/CTSC': '#6b7280'
            };
            return map[d] || '#9CA3AF';
        }

        function vizShape(shape, x, y, r, color, op) {
            var alpha = (op === undefined) ? 1 : op;
            var fill = ' fill="' + color + '" fill-opacity="' + alpha + '"';
            if (shape === 'square') {
                return '<rect x="' + (x - r) + '" y="' + (y - r) + '" width="' + (2 * r) + '" height="' + (2 * r) + '" rx="2"' + fill + '/>';
            }
            if (shape === 'diamond') {
                return '<polygon points="' + x + ',' + (y - r) + ' ' + (x + r) + ',' + y + ' ' + x + ',' + (y + r) + ' ' + (x - r) + ',' + y + '"' + fill + '/>';
            }
            if (shape === 'triangle') {
                return '<polygon points="' + x + ',' + (y - r) + ' ' + (x + r * 0.88) + ',' + (y + r * 0.72) + ' ' + (x - r * 0.88) + ',' + (y + r * 0.72) + '"' + fill + '/>';
            }
            if (shape === 'hex') {
                var pts = [];
                for (var i = 0; i < 6; i++) {
                    var a = (-90 + i * 60) * Math.PI / 180;
                    pts.push((x + Math.cos(a) * r).toFixed(1) + ',' + (y + Math.sin(a) * r).toFixed(1));
                }
                return '<polygon points="' + pts.join(' ') + '"' + fill + '/>';
            }
            if (shape === 'star') {
                var pts2 = [];
                for (var j = 0; j < 10; j++) {
                    var a2 = (-90 + j * 36) * Math.PI / 180;
                    var rr = (j % 2 === 0) ? r : r * 0.45;
                    pts2.push((x + Math.cos(a2) * rr).toFixed(1) + ',' + (y + Math.sin(a2) * rr).toFixed(1));
                }
                return '<polygon points="' + pts2.join(' ') + '"' + fill + '/>';
            }
            return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '"' + fill + '/>';
        }

        function vizMoveTip(ev) {
            var tip = document.getElementById('viz-tip');
            var x = ev.clientX + 16, y = ev.clientY + 16;
            var w = tip.offsetWidth, h = tip.offsetHeight;
            if (x + w > window.innerWidth - 12) x = ev.clientX - w - 16;
            if (y + h > window.innerHeight - 12) y = ev.clientY - h - 16;
            tip.style.left = x + 'px';
            tip.style.top = y + 'px';
        }

        function bindVizNodes(container) {
            var nodes = container.querySelectorAll('.viz-node');
            for (var i = 0; i < nodes.length; i++) {
                (function(el) {
                    el.addEventListener('mouseenter', function(ev) {
                        var info = VIZ_INFO[el.getAttribute('data-id')];
                        if (!info) return;
                        if (vizTipTimer) clearTimeout(vizTipTimer);
                        vizTipTimer = setTimeout(function() {
                            var tip = document.getElementById('viz-tip');
                            tip.innerHTML = info;
                            tip.style.display = 'block';
                            vizMoveTip(ev);
                        }, 350);
                    });
                    el.addEventListener('mousemove', function(ev) {
                        var tip = document.getElementById('viz-tip');
                        if (tip.style.display === 'block') vizMoveTip(ev);
                    });
                    el.addEventListener('mouseleave', function() {
                        if (vizTipTimer) { clearTimeout(vizTipTimer); vizTipTimer = null; }
                        document.getElementById('viz-tip').style.display = 'none';
                    });
                })(nodes[i]);
            }
        }

        function vizAuthors(item) {
            var names = [];
            (item.versions || []).forEach(function(v) {
                if (v.author && names.indexOf(v.author) < 0) names.push(v.author);
            });
            return names.length ? names.join(' / ') : '站主';
        }

        function vizTagHtml(tags) {
            var out = '';
            (tags || []).slice(0, 8).forEach(function(t) {
                out += '<span class="t-tag">' + escHtml(t) + '</span>';
            });
            return out;
        }

        // ---------- 星图 ----------
        var starCenterId = null;

        function openStarMap(kpId) {
            var kp = null;
            KNOWLEDGE_DATA.forEach(function(k) { if (k.id === kpId) kp = k; });
            if (!kp) return;
            starCenterId = kpId;
            document.getElementById('viz-tip').style.display = 'none';

            var byId = {};
            KNOWLEDGE_DATA.forEach(function(k) { byId[k.id] = k; });

            var pre = [], dep = [], rel = [], seen = {};
            seen[kpId] = 1;
            (kp.prerequisites || []).forEach(function(id) {
                if (byId[id] && !seen[id]) { seen[id] = 1; pre.push(id); }
            });
            KNOWLEDGE_DATA.forEach(function(k) {
                if (!seen[k.id] && (k.prerequisites || []).indexOf(kpId) >= 0) { seen[k.id] = 1; dep.push(k.id); }
            });
            (kp.related || []).forEach(function(id) {
                if (byId[id] && !seen[id]) { seen[id] = 1; rel.push(id); }
            });

            var W = 1040, H = 760, cx = W / 2, cy = H / 2;
            var R1 = 220, R2 = 320;
            var pos = {};
            var totalNodes = pre.length + dep.length + rel.length;
            // 邻居很多时（例如大类总述），弧形会挤成一团；改用“中心 + 两列邻居”的布局
            var columnLayout = totalNodes > 12;
            if (columnLayout) cx = 300;

            function placeArc(list, radius, a0, a1) {
                for (var i = 0; i < list.length; i++) {
                    var t = list.length === 1 ? 0.5 : i / (list.length - 1);
                    var a = (a0 + (a1 - a0) * t) * Math.PI / 180;
                    pos[list[i]] = { x: cx + Math.cos(a) * radius, y: cy + Math.sin(a) * radius };
                }
            }
            if (columnLayout) {
                var list = pre.concat(dep, rel);
                var perCol = Math.ceil(list.length / 2);
                var colX = [560, 810];
                for (var li = 0; li < list.length; li++) {
                    var col = Math.floor(li / perCol);
                    var rowsInCol = Math.min(perCol, list.length - col * perCol);
                    var row = li - col * perCol;
                    var yy = rowsInCol === 1 ? cy : 90 + (H - 150) * row / (rowsInCol - 1);
                    pos[list[li]] = { x: colX[col], y: yy };
                }
            } else {
                placeArc(pre, R1, 110, 250);
                placeArc(dep, R1, -70, 70);
                for (var i = 0; i < rel.length; i++) {
                    var ra = (-90 + i * 360 / rel.length) * Math.PI / 180;
                    pos[rel[i]] = { x: cx + Math.cos(ra) * R2, y: cy + Math.sin(ra) * R2 };
                }
            }

            VIZ_INFO = {};
            var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
            svg += '<defs><marker id="viz-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
                   '<path d="M0,0 L10,5 L0,10 z" fill="rgba(96,165,250,0.9)"/></marker></defs>';

            function edgePoint(a, b, shrinkA, shrinkB) {
                var dx = b.x - a.x, dy = b.y - a.y;
                var len = Math.sqrt(dx * dx + dy * dy) || 1;
                var ux = dx / len, uy = dy / len;
                return {
                    x1: (a.x + ux * shrinkA).toFixed(1), y1: (a.y + uy * shrinkA).toFixed(1),
                    x2: (b.x - ux * shrinkB).toFixed(1), y2: (b.y - uy * shrinkB).toFixed(1)
                };
            }

            pre.forEach(function(id) {
                var e = edgePoint(pos[id], { x: cx, y: cy }, 14, 50);
                svg += '<line class="viz-edge-pre" x1="' + e.x1 + '" y1="' + e.y1 + '" x2="' + e.x2 + '" y2="' + e.y2 + '" marker-end="url(#viz-arrow)"/>';
            });
            dep.forEach(function(id) {
                var e = edgePoint({ x: cx, y: cy }, pos[id], 50, 14);
                svg += '<line class="viz-edge-pre" x1="' + e.x1 + '" y1="' + e.y1 + '" x2="' + e.x2 + '" y2="' + e.y2 + '" marker-end="url(#viz-arrow)"/>';
            });
            rel.forEach(function(id) {
                var e = edgePoint(pos[id], { x: cx, y: cy }, 14, 38);
                svg += '<line class="viz-edge-rel" x1="' + e.x1 + '" y1="' + e.y1 + '" x2="' + e.x2 + '" y2="' + e.y2 + '"/>';
            });

            function drawNode(k, x, y, r, isCenter) {
                var st = catStyle(k.category);
                VIZ_INFO[k.id] = '<b>' + escHtml(k.title) + '</b><br>' +
                    '<span class="t-muted">' + escHtml(k.category) + ' · ' + escHtml(k.subcategory) + '</span><br>' +
                    '<span class="t-muted">作者：' + escHtml(vizAuthors(k)) + '</span><br>' +
                    vizTagHtml(k.tags);
                var click = isCenter ? '' : ' onclick="starJump(\'' + k.id + '\')"';
                var stroke = isCenter ? ' stroke="#f8fafc" stroke-width="2"' : ' stroke="rgba(255,255,255,0.35)" stroke-width="1"';
                var out = '<g class="viz-node" data-id="' + k.id + '"' + click + '>';
                if (isCenter) out += '<circle cx="' + x + '" cy="' + y + '" r="' + (r + 9) + '" fill="' + st.color + '" fill-opacity="0.18"/>';
                out += vizShape(st.shape, x, y, r, st.color).replace('/>', stroke + '/>');
                out += '</g>';
                var anchor = isCenter ? 'middle' : (x < cx ? 'end' : 'start');
                var dx = isCenter ? 0 : (x < cx ? -16 : 16);
                var dy = isCenter ? (r + 34) : 4;
                if (isCenter) {
                    // 中心标题加背板：挡住穿过的关联虚线，保证可读
                    var lw = 0;
                    for (var ci = 0; ci < k.title.length; ci++) {
                        lw += k.title.charCodeAt(ci) > 255 ? 19 : 10.5;
                    }
                    out += '<rect x="' + (x - lw / 2 - 10) + '" y="' + (y + dy - 19) + '" width="' + (lw + 20) + '" height="27" rx="7" fill="rgba(7,11,24,0.92)"/>';
                }
                var labelText = k.title;
                if (!isCenter && columnLayout && labelText.length > 14) labelText = labelText.slice(0, 14) + '…';
                out += '<text class="viz-label' + (isCenter ? ' center' : '') + '" x="' + (x + dx) + '" y="' + (y + dy) + '" text-anchor="' + anchor + '">' + escHtml(labelText) + '</text>';
                return out;
            }

            pre.concat(dep, rel).forEach(function(id) {
                var p = pos[id];
                svg += drawNode(byId[id], p.x, p.y, 11, false);
            });
            svg += drawNode(kp, cx, cy, 26, true);
            if (pre.length + dep.length + rel.length === 0) {
                svg += '<text class="viz-label" x="' + cx + '" y="' + (cy + 78) + '" text-anchor="middle">该知识点暂未登记前置或关联节点</text>';
            }
            svg += '</svg>';

            document.getElementById('star-title').textContent = '星图 · ' + kp.title;
            var legend = '';
            var used = [];
            [kp].concat(pre.map(function(id) { return byId[id]; }), dep.map(function(id) { return byId[id]; }), rel.map(function(id) { return byId[id]; })).forEach(function(k) {
                if (k && used.indexOf(k.category) < 0) used.push(k.category);
            });
            used.forEach(function(c) {
                legend += '<span><i style="background:' + catStyle(c).color + '"></i>' + escHtml(c) + '</span>';
            });
            legend += '<span><i style="background:rgba(96,165,250,0.9)"></i>前置→高阶</span>';
            legend += '<span><i style="background:rgba(148,163,184,0.6)"></i>关联（无向）</span>';
            document.getElementById('star-legend').innerHTML = legend;

            var body = document.getElementById('star-body');
            body.innerHTML = svg;
            bindVizNodes(body);
            document.getElementById('star-overlay').classList.add('open');
        }

        function starJump(id) {
            // 不离开星图：把被点击的节点切成新的中心，继续在原浮层里探索
            openStarMap(id);
        }

        function closeStarMap() {
            document.getElementById('star-overlay').classList.remove('open');
            document.getElementById('viz-tip').style.display = 'none';
        }

        // Esc / 关闭按钮：退出星图并打开当前中心对应的栏目（大类总述页含简介与子分类目录）
        function exitStarMap() {
            var id = starCenterId;
            closeStarMap();
            if (id) selectKP(id);
        }

        // ---------- 维恩图 ----------
        function vennHash(s) {
            var h = 0;
            for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
            return h;
        }

        function openVenn() {
            var cats = [];
            PROBLEMS_DATA.forEach(function(p) {
                var c = p.category || '未分类';
                if (cats.indexOf(c) < 0) cats.push(c);
            });
            cats.sort();

            // 先展开浮层并填好图例（图例会换行、改变画布高度），再量画布实际比例
            var venBody = document.getElementById('venn-body');
            document.getElementById('venn-overlay').classList.add('open');
            var lg = '';
            cats.forEach(function(c) {
                lg += '<span><i style="background:' + catStyle(c).color + '"></i>' + escHtml(c) + '</span>';
            });
            lg += '<span style="color:#94a3b8">点色＝难度：</span>';
            ['入门', '普及−', '普及/提高−', '普及+/提高−', '提高', '提高+/省选−', '省选/NOI−', '暂未评定'].forEach(function(d) {
                lg += '<span><i style="background:' + diffColor(d) + '"></i>' + escHtml(d) + '</span>';
            });
            document.getElementById('venn-legend').innerHTML = lg;
            var bodyAspect = (venBody.clientWidth || 1500) / Math.max(1, venBody.clientHeight || 800);

            var W = 2400, H = 1400, cx = W / 2, cy = H / 2, PAD = 34;
            var pos = {}, cnt = {};
            cats.forEach(function(c) { cnt[c] = 0; });
            PROBLEMS_DATA.forEach(function(p) {
                var c = p.category || '未分类';
                if (cnt[c] !== undefined) cnt[c]++;
            });
            // 半径按题目数缩放并封顶，避免大圆顶出画布
            cats.forEach(function(c) {
                pos[c] = { x: 0, y: 0, r: Math.min(196, 74 + Math.sqrt(cnt[c] || 1) * 23) };
            });
            // 环形初值 + 轻推松弛 + 边界夹紧，保证所有圆完整落在画布内
            var Rx = 460, Ry = 225;
            cats.forEach(function(c, i) {
                var a = -Math.PI / 2 + i * 2 * Math.PI / cats.length;
                pos[c].x = cx + Math.cos(a) * Rx;
                pos[c].y = cy + Math.sin(a) * Ry;
            });
            for (var it = 0; it < 220; it++) {
                for (var bi = 0; bi < cats.length; bi++) {
                    for (var bj = bi + 1; bj < cats.length; bj++) {
                        var A = pos[cats[bi]], B = pos[cats[bj]];
                        var ddx = B.x - A.x, ddy = B.y - A.y;
                        var dd = Math.sqrt(ddx * ddx + ddy * ddy) || 1;
                        var minD = (A.r + B.r) * 0.72;
                        if (dd < minD) {
                            var push = (minD - dd) / dd * 0.25;
                            A.x -= ddx * push; A.y -= ddy * push;
                            B.x += ddx * push; B.y += ddy * push;
                        }
                    }
                }
                cats.forEach(function(c) {
                    var p = pos[c];
                    p.x = Math.max(p.r + PAD, Math.min(W - p.r - PAD, p.x));
                    p.y = Math.max(p.r + PAD + 24, Math.min(H - p.r - PAD, p.y));
                });
            }
            // 宽屏时把布局横向拉开，充分利用水平空间；窄屏保持圆形聚拢
            var kx = Math.max(1, Math.min(1.55, bodyAspect / 1.5));
            cats.forEach(function(c) {
                var p = pos[c];
                p.x = cx + (p.x - cx) * kx;
                p.x = Math.max(p.r + PAD, Math.min(W - p.r - PAD, p.x));
            });

            var tagCat = {};
            KNOWLEDGE_DATA.forEach(function(k) {
                (k.tags || []).forEach(function(t) {
                    var key = String(t).toLowerCase();
                    if (!tagCat[key]) tagCat[key] = {};
                    tagCat[key][k.category] = 1;
                });
            });

            // 按实际内容包围盒取 viewBox，充分利用浮层空间（避免四周大片留白）
            var bb = { x1: 1e9, y1: 1e9, x2: -1e9, y2: -1e9 };
            cats.forEach(function(c) {
                var p = pos[c];
                bb.x1 = Math.min(bb.x1, p.x - p.r); bb.y1 = Math.min(bb.y1, p.y - p.r);
                bb.x2 = Math.max(bb.x2, p.x + p.r); bb.y2 = Math.max(bb.y2, p.y + p.r);
            });
            var vp = 26;
            var vbW = (bb.x2 - bb.x1) + vp * 2, vbH = (bb.y2 - bb.y1) + vp * 2;
            // 让 viewBox 比例贴合浮层画布，避免单方向出现大片留白
            var aspect = Math.max(1.1, Math.min(2.8, bodyAspect));
            if (vbW / vbH < aspect) vbW = vbH * aspect;
            else vbH = vbW / aspect;
            var vbX = (bb.x1 + bb.x2) / 2 - vbW / 2;
            var vbY = (bb.y1 + bb.y2) / 2 - vbH / 2;

            VIZ_INFO = {};
            var svg = '<svg viewBox="' + vbX.toFixed(0) + ' ' + vbY.toFixed(0) + ' ' + vbW.toFixed(0) + ' ' + vbH.toFixed(0) + '" preserveAspectRatio="xMidYMid meet">';

            cats.forEach(function(c) {
                var p = pos[c], st = catStyle(c);
                var dist = {};
                PROBLEMS_DATA.forEach(function(q) {
                    if ((q.category || '未分类') !== c) return;
                    var d = q.difficulty || '暂未评定';
                    dist[d] = (dist[d] || 0) + 1;
                });
                var distHtml = Object.keys(dist).sort().map(function(d) {
                    return '<span class="t-tag" style="border-left:3px solid ' + diffColor(d) + '">' + escHtml(d) + ' ×' + dist[d] + '</span>';
                }).join('');
                VIZ_INFO['cat:' + c] = '<b>' + escHtml(c) + '</b><br>' +
                    '<span class="t-muted">题目 ' + (cnt[c] || 0) + ' 道</span><br>' + distHtml;
                svg += '<g class="viz-node" data-id="cat:' + escHtml(c) + '">' +
                    '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + p.r.toFixed(1) + '" fill="' + st.color + '" fill-opacity="0.10" stroke="' + st.color + '" stroke-opacity="0.45" stroke-width="1.4"/>' +
                    '</g>';
            });

            // 先按「所属集合组合」分组，再在每组内用向日葵螺旋均匀铺点，避免重叠
            var groups = {}, order = [];
            PROBLEMS_DATA.forEach(function(p) {
                var set = {};
                set[p.category || '未分类'] = 1;
                (p.tags || []).forEach(function(t) {
                    var m = tagCat[String(t).toLowerCase()];
                    if (!m) return;
                    for (var c in m) { if (pos[c]) set[c] = 1; }
                });
                var arr = Object.keys(set).filter(function(c) { return !!pos[c]; });
                if (!arr.length) return;
                if (arr.length > 3) arr = arr.slice(0, 3);
                arr.sort();
                var key = arr.join('|');
                if (!groups[key]) { groups[key] = { cats: arr, items: [] }; order.push(key); }
                groups[key].items.push(p);
            });
            order.sort(function(a, b) { return groups[a].cats.length - groups[b].cats.length; });

            var points = [];
            order.forEach(function(key) {
                var g = groups[key], n = g.items.length;
                var ax = 0, ay = 0;
                g.cats.forEach(function(c) { ax += pos[c].x; ay += pos[c].y; });
                ax /= g.cats.length; ay /= g.cats.length;
                var maxR = g.cats.length === 1 ? pos[g.cats[0]].r * 0.74 : 34;
                var spin = (vennHash(key) % 360) * Math.PI / 180;
                g.items.forEach(function(p, i) {
                    var rr = maxR * Math.sqrt((i + 0.6) / n);
                    var aa = spin + i * 2.399963;
                    points.push({ p: p, x: ax + Math.cos(aa) * rr, y: ay + Math.sin(aa) * rr });
                });
            });

            // 全局斥力松弛：把跨分组撞在一起的点推开，保证每个点可单独悬停
            for (var pit = 0; pit < 80; pit++) {
                var moved = false;
                for (var pi = 0; pi < points.length; pi++) {
                    for (var pj = pi + 1; pj < points.length; pj++) {
                        var pa = points[pi], pb = points[pj];
                        var vx = pb.x - pa.x, vy = pb.y - pa.y;
                        var vd = Math.sqrt(vx * vx + vy * vy);
                        if (vd >= 16) continue;
                        if (vd < 0.01) { vx = 0.7; vy = 0.7; vd = 1; }
                        var mv = (16 - vd) / vd * 0.5;
                        pa.x -= vx * mv; pa.y -= vy * mv;
                        pb.x += vx * mv; pb.y += vy * mv;
                        moved = true;
                    }
                }
                if (!moved) break;
            }

            points.forEach(function(pt) {
                var p = pt.p;
                var color = diffColor(p.difficulty);
                var tagStr = (p.tags || []).slice(0, 6).map(function(t) {
                    return '<span class="t-tag">' + escHtml(t) + '</span>';
                }).join('');
                VIZ_INFO[p.id] = '<b>' + escHtml(p.title) + '</b><br>' +
                    '<span class="t-muted">' + escHtml(p.difficulty || '暂未评定') +
                    (p.oj ? ' · ' + escHtml(p.oj) + (p.problemId && p.problemId !== '-' ? ' ' + escHtml(p.problemId) : '') : '') + '</span><br>' +
                    (p.source ? '<span class="t-muted">来源：' + escHtml(p.source) + '</span><br>' : '') +
                    '<span class="t-muted">作者：' + escHtml(vizAuthors(p)) + '</span><br>' + tagStr;
                svg += '<g class="viz-node" data-id="' + p.id + '" onclick="vennJump(\'' + p.id + '\')">' +
                    '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="7" fill="' + color + '" stroke="rgba(8,12,26,0.85)" stroke-width="1.2"/>' +
                    '</g>';
            });
            cats.forEach(function(c) {
                var p = pos[c];
                // 标签加深色背板，避免被题目点压住看不清
                var lw = 0;
                for (var ci = 0; ci < c.length; ci++) lw += c.charCodeAt(ci) > 255 ? 20 : 11;
                svg += '<rect x="' + (p.x - lw / 2 - 10).toFixed(1) + '" y="' + (p.y - p.r + 5).toFixed(1) + '" width="' + (lw + 20).toFixed(1) + '" height="29" rx="9" fill="rgba(7,11,24,0.72)"/>';
                svg += '<text class="viz-bubble-label" x="' + p.x.toFixed(1) + '" y="' + (p.y - p.r + 26).toFixed(1) + '" text-anchor="middle">' + escHtml(c) + '</text>';
            });
            svg += '</svg>';

            var body = document.getElementById('venn-body');
            body.innerHTML = svg;
            bindVizNodes(body);
        }

        function vennJump(id) {
            closeVenn();
            switchMode('prob');
            selectProblem(id);
        }

        function closeVenn() {
            document.getElementById('venn-overlay').classList.remove('open');
            document.getElementById('viz-tip').style.display = 'none';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Escape') return;
            if (document.getElementById('star-overlay').classList.contains('open')) {
                exitStarMap();
                return;
            }
            closeVenn();
        });

        // ===== Start =====
        init();
    </script>



    <!-- Tag Filter Modal -->
    <div class="tag-modal-overlay" id="tag-modal-overlay" onclick="closeTagModal()">
        <div class="tag-modal" onclick="event.stopPropagation()">
            <div class="tag-modal-header">
                <span class="tag-modal-title">🏷️ 选择标签</span>
                <span class="tag-modal-close" onclick="closeTagModal()">✕</span>
            </div>
            <div class="tag-modal-body" id="tag-modal-body"></div>
            <div class="tag-modal-footer">
                <div class="tag-modal-selected">
                    <span class="tag-modal-selected-label">已选：</span>
                    <span class="tag-modal-selected-list" id="tag-modal-selected-list">无</span>
                </div>
                <div class="tag-modal-mode-switch">
                    <span class="tag-modal-mode-label">模式：</span>
                    <button class="tag-modal-mode-btn" id="modal-mode-inter" onclick="setModalTagMode('intersection')">交集</button>
                    <button class="tag-modal-mode-btn" id="modal-mode-union" onclick="setModalTagMode('union')">并集</button>
                </div>
                <div class="tag-modal-actions">
                    <button class="tag-modal-btn tag-modal-btn-clear" onclick="tempSelectedTags.clear(); renderTagModal();">全部清除</button>
                    <button class="tag-modal-btn tag-modal-btn-ok" onclick="applyTagFilter()">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 星图 -->
    <div class="viz-overlay" id="star-overlay">
        <div class="viz-header">
            <span class="viz-title" id="star-title">星图</span>
            <span class="viz-legend" id="star-legend"></span>
            <button class="viz-close" onclick="exitStarMap()">关闭 Esc</button>
        </div>
        <div class="viz-body" id="star-body"></div>
    </div>

    <!-- 维恩图 -->
    <div class="viz-overlay" id="venn-overlay">
        <div class="viz-header">
            <span class="viz-title">题目维恩图</span>
            <span class="viz-legend" id="venn-legend"></span>
            <button class="viz-close" onclick="closeVenn()">关闭 Esc</button>
        </div>
        <div class="viz-body" id="venn-body"></div>
    </div>

    <div class="viz-tip" id="viz-tip"></div>

</body></html>
